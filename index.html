cation: \u003ccode\u003esrc/components/layout/control-bar/program-completeness-section.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: program completion/incompletion control for event/tracker flows.\u003c/li\u003e\u003cli\u003eMain props: none (selection/event/tracker store-driven).\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;ProgramCompletenessSection /\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: event/tracker workflows tied to associated completeness logic.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: alternate program completion buttons.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e3) RunValidationsSection\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eRunValidationsSection\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/layout/control-bar/run-validations-section.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: trigger and display dataset validation results.\u003c/li\u003e\u003cli\u003eMain props: none.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;RunValidationsSection /\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: aggregate validation checks.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: parallel validation triggers.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e4) EventRegisterSection\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eEventRegisterSection\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/layout/control-bar/event-register-section.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: create/register event entries with dirty-state protection.\u003c/li\u003e\u003cli\u003eMain props: none.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;EventRegisterSection /\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: event program list/capture workflows.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: additional event registration action bars.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e5) TrackerRegisterSection\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eTrackerRegisterSection\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/layout/control-bar/tracker-register-section.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: TEI registration/search actions for tracker programs.\u003c/li\u003e\u003cli\u003eMain props: none.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;TrackerRegisterSection /\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: tracker list/registration flows.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: alternative tracker register controls.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eDuplicate Prevention Matrix\u003c/h3\u003e\u003cp\u003eBefore creating a new component, check this matrix first:\u003c/p\u003e\u003cdiv class=\"handbook-table-wrap\"\u003e\u003ctable class=\"handbook-table\"\u003e\u003ctr\u003e\u003cth\u003e\u003cp\u003eNeed\u003c/p\u003e\u003c/th\u003e\u003cth\u003e\u003cp\u003eUse Existing\u003c/p\u003e\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eAction with spinner\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003eLoadingButton\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eSingle searchable choice\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003eSelect\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eMultiple searchable choices\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003eMultiSelect\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eGeneric modal\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003e\u003ccode\u003eDialog\u003c/code\u003e family\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eConfirmation modal\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003e\u003ccode\u003eAlertDialog\u003c/code\u003e family\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eInline warning/info\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003e\u003ccode\u003eAlert\u003c/code\u003e family\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eOrg unit selection\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003eOrgUnitSelector\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003ePeriod selection\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003ePeriodSelector\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eMetadata-driven DHIS2 field\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003e\u003ccode\u003eDhis2Input\u003c/code\u003e / \u003ccode\u003eRhfDhis2Input\u003c/code\u003e\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eDataset form field\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003eRhfAggregateDhis2Input\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eFile upload for events\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003eDhis2FileInput\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eFile upload generic\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003eFilePicker\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eTable rendering\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003e\u003ccode\u003eTable\u003c/code\u003e family\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003ePagination controls\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003e\u003ccode\u003ePagination\u003c/code\u003e family\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e", "trackerDevelopment": "\u003ch2\u003e6. Create a New Tracker Program\u003c/h2\u003e\u003ch3\u003eScenario\u003c/h3\u003e\u003cp\u003eWe want to create a new Tracker program called ANC.\u003c/p\u003e\u003cp\u003eWe will use the existing PNC implementation as a template.\u003c/p\u003e\u003ch3\u003eStep 1 - Create the Program Folder\u003c/h3\u003e\u003cp\u003eCopy this folder:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003esrc/extensions/tracker/programs/pnc\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eInto this folder:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003esrc/extensions/tracker/programs/anc\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRename files from PNC naming to ANC naming.\u003c/p\u003e\u003cp\u003eExample rename map:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003epnc-enrollment-form.jsx -\u0026gt; anc-enrollment-form.jsx\u003c/li\u003e\u003cli\u003epnc-profile.jsx -\u0026gt; anc-profile.jsx\u003c/li\u003e\u003cli\u003epnc-stage.jsx -\u0026gt; anc-stage.jsx\u003c/li\u003e\u003cli\u003epncProfileRules.js -\u0026gt; ancProfileRules.js\u003c/li\u003e\u003cli\u003epncStageRules.js -\u0026gt; ancStageRules.js\u003c/li\u003e\u003cli\u003econst.js -\u0026gt; const.js (keep file name, update content)\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eComplete expected folder structure:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003esrc/extensions/tracker/programs/anc/\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e├── const.js\u003c/p\u003e\u003cp\u003e├── anc-enrollment-form.jsx\u003c/p\u003e\u003cp\u003e├── anc-profile.jsx\u003c/p\u003e\u003cp\u003e├── anc-stage.jsx\u003c/p\u003e\u003cp\u003e├── ancProfileRules.js\u003c/p\u003e\u003cp\u003e└── ancStageRules.js\u003c/p\u003e\u003ch3\u003eStep 2 - Update Constants\u003c/h3\u003e\u003cp\u003eModify these files:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/const.js\u003c/li\u003e\u003cli\u003esrc/extensions/tracker/const.js\u003c/li\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/anc-profile.jsx\u003c/li\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/anc-stage.jsx\u003c/li\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/anc-enrollment-form.jsx\u003c/li\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/ancStageRules.js\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eWhat to replace:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eProgram ID\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC example from src/extensions/tracker/const.js:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003ePNC: \"u1Na9wCGY6d\"\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eANC example in same file:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eANC: \"fflLsS1lm3g\"\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eIf you are creating a brand new DHIS2 program (not the existing ANC in this repo), replace with that program UID.\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eProgram Stage IDs\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC example from src/extensions/tracker/programs/pnc/const.js:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eexport const PNC_PROGRAM_STAGE = \"huYWjrG6A1C\";\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eIn ANC const.js, define ANC stage constant(s) and replace all imports/usages in forms and rules.\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eData Element IDs\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC example from src/extensions/tracker/programs/pnc/const.js:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eexport const PNC_DATA_ELEMENTS = {\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eVISIT_NUMBER: \"LvSuOSBXj10\",\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eNEXT_APPOINTMENT_DATE: \"Rg0YjOCLnsl\",\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eMCH_BOOK: \"GgfEUl3oXi6\"\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e};\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eIn ANC const.js, create ANC data element map and replace every PNC data element reference.\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eAttribute IDs\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC uses shared attributes from src/extensions/tracker/const.js via ALL_CHR_ATTRIBUTES (for example HEALTH_ID, PROVINCE, MOBILE, DOB) and one module-level mapping MCH_BOOK_ATTRIBUTE in pnc const.js.\u003c/p\u003e\u003cp\u003eFor ANC, replace attribute constants only when ANC metadata requires different attributes. Keep shared ALL_CHR_ATTRIBUTES usage when IDs are the same.\u003c/p\u003e\u003ch3\u003eStep 3 - Create ANC Forms\u003c/h3\u003e\u003ch4\u003eEnrollment form\u003c/h4\u003e\u003cp\u003eCopy:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/pnc/pnc-enrollment-form.jsx\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eTo:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/anc-enrollment-form.jsx\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eUpdate these sections:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name and export\u003c/li\u003e\u003cli\u003eImport from ANC const file instead of PNC const file\u003c/li\u003e\u003cli\u003ePayload programStage and dataValues mapping\u003c/li\u003e\u003cli\u003eRequired field validation logic in change function\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC reference points:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUses PNC_PROGRAM_STAGE in enrollment payload\u003c/li\u003e\u003cli\u003eUses PNC_DATA_ELEMENTS values for dataValues\u003c/li\u003e\u003cli\u003eCalls saveEnrollment, enrollChr, saveTei\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eProfile form\u003c/h4\u003e\u003cp\u003eCopy:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/pnc/pnc-profile.jsx\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eTo:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/anc-profile.jsx\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eUpdate these sections:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name and export\u003c/li\u003e\u003cli\u003eANC-specific special field handling if needed\u003c/li\u003e\u003cli\u003eKeep metadata-driven loop:\nconst attributes = program.programTrackedEntityAttributes.map((ptea) =\u0026gt; ptea.trackedEntityAttribute.id);\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eChange metadata references only if ANC rules require different behavior for specific attributes.\u003c/p\u003e\u003ch4\u003eStage form\u003c/h4\u003e\u003cp\u003eCopy:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/pnc/pnc-stage.jsx\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eTo:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/anc-stage.jsx\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eUpdate these sections:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eImport ANC stage constant and ANC data element constants\u003c/li\u003e\u003cli\u003eProgram stage lookup constant\u003c/li\u003e\u003cli\u003eANC-specific field behavior (for example maxDate/custom logic)\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC reference pattern:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003econst programStage = program.programStages.find((ps) =\u0026gt; ps.id === PNC_PROGRAM_STAGE);\u003c/code\u003e\u003c/pre\u003e\u003ch3\u003eStep 4 - Create ANC Rules\u003c/h3\u003e\u003cp\u003eHow PNC rules are implemented:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eProfile rules: src/extensions/tracker/programs/pnc/pncProfileRules.js\u003c/li\u003e\u003cli\u003eStage rules: src/extensions/tracker/programs/pnc/pncStageRules.js\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC profile rules pattern:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eimport { commonChrProfileRules } from \"@/extensions/tracker/programs/common/commonRules\";\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003econst rules = [...commonChrProfileRules];\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eexport default rules;\u003c/code\u003e\u003c/pre\u003e\u003cp\u003ePNC stage rule pattern uses:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003ewatches\u003c/li\u003e\u003cli\u003eexpression\u003c/li\u003e\u003cli\u003eactionsWhenPassed\u003c/li\u003e\u003cli\u003eactionsWhenFailed\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExample from PNC stage rules:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e{\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eexpression: ({ currentValues }) =\u0026gt; currentValues[VISIT_NUMBER] !== \"1\",\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003ewatches: [VISIT_NUMBER],\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eactionsWhenPassed: [\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e{ targets: [WITH_IN_24H], type: \"hide\" },\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e{ targets: [WITH_IN_24H], type: \"assign\", generateValue: () =\u0026gt; \"\" }\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e],\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eactionsWhenFailed: []\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e}\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eHow to create ANC rules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eCopy PNC rule files to ANC rule files.\u003c/li\u003e\u003cli\u003eReplace PNC constants with ANC constants.\u003c/li\u003e\u003cli\u003eReplace PNC-specific logic with ANC business rules.\u003c/li\u003e\u003cli\u003eKeep the same rule object structure so the existing rule engine can execute it.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eStep 5 - Register ANC in programConfig\u003c/h3\u003e\u003cp\u003eModify file:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/programConfig.js\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExisting PNC registration:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e[PNC]: {\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofile: PncProfile,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofileRules: pncProfileRules,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofileSaveMethod: chrProfileSave,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003edashboard: MchDashboard,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003edashboardTitleAttributes: [HEALTH_ID, FIRST_NAME],\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eenrollmentForm: PncEnrollmentForm,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e[PNC_PROGRAM_STAGE + \"stage\"]: PncStage,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e[PNC_PROGRAM_STAGE + \"rules\"]: pncStageRules,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003euseSequence: true\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e}\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eExample ANC registration:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e[ANC]: {\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofile: AncProfile,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofileRules: ancProfileRules,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofileSaveMethod: chrProfileSave,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003edashboard: MchDashboard,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003edashboardTitleAttributes: [HEALTH_ID, FIRST_NAME],\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eenrollmentForm: AncEnrollmentForm,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e[ANC_PROGRAM_STAGE + \"stage\"]: AncStage,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e[ANC_PROGRAM_STAGE + \"rules\"]: ancStageRules,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003euseSequence: true\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e}\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eProperty guide:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eprofile: ANC profile form component\u003c/li\u003e\u003cli\u003eprofileRules: ANC profile rule array\u003c/li\u003e\u003cli\u003eprofileSaveMethod: profile save strategy (CHR flow uses chrProfileSave)\u003c/li\u003e\u003cli\u003edashboard: dashboard component used for this program\u003c/li\u003e\u003cli\u003edashboardTitleAttributes: TEA list shown in dashboard header\u003c/li\u003e\u003cli\u003eenrollmentForm: ANC enrollment form component\u003c/li\u003e\u003cli\u003e[STAGE + \"stage\"]: form component for that stage\u003c/li\u003e\u003cli\u003e[STAGE + \"rules\"]: rule array for that stage\u003c/li\u003e\u003cli\u003euseSequence: enables numbered field sequence in stage form\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eStep 6 (Optional) - Link ANC to CHR\u003c/h3\u003e\u003cp\u003eUse this step only if your new tracker program should use CHR search/registration behavior.\u003c/p\u003e\u003ch4\u003e6.1 Add your program in useSearchChr\u003c/h4\u003e\u003cp\u003eModify file:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/hooks/useSearchChr.jsx\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC/ANC reference pattern in this file:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003econst { ANC, PNC, DELIVERY, FAMILY_PLANNING, EIR, CHR, SURVEILLANCE_2_0, AEFI } = ALL_PROGRAMS;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e...\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e} else if (program \u0026amp;\u0026amp; [ANC, PNC, DELIVERY, FAMILY_PLANNING, EIR, SURVEILLANCE_2_0, AEFI].includes(program.id)) {\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eIf your new program is not already in this list, add it to both:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003ethe constant destructuring from \u003ccode\u003eALL_PROGRAMS\u003c/code\u003e\u003c/li\u003e\u003cli\u003ethe \u003ccode\u003e.includes(program.id)\u003c/code\u003e list\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e6.2 Use chrProfileSave in programConfig\u003c/h4\u003e\u003cp\u003eModify file:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/programConfig.js\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eFor CHR-linked programs, set:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eprofileSaveMethod: chrProfileSave,\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eExample (already used by PNC and ANC):\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e[ANC]: {\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofile: AncProfile,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofileRules: ancProfileRules,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofileSaveMethod: chrProfileSave,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e...\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e}\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eIf \u003ccode\u003eprofileSaveMethod\u003c/code\u003e is different, CHR-linked save behavior will not follow the same flow.\u003c/p\u003e\u003ch3\u003eStep 7 - Register ANC Program ID\u003c/h3\u003e\u003cp\u003eModify file:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/const.js\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExisting PNC constant:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003ePNC: \"u1Na9wCGY6d\"\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eANC constant example:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eANC: \"fflLsS1lm3g\"\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eWhere the new program ID comes from:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse the DHIS2 Program UID from your target environment metadata.\u003c/li\u003e\u003cli\u003eIn this repository, program metadata is loaded by src/hooks/useInit.js using getPrograms.\u003c/li\u003e\u003cli\u003eIf this is a truly new program, use that new UID in ALL_PROGRAMS and in your ANC-specific constants.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eStep 8 - Verify Metadata\u003c/h3\u003e\u003cp\u003eChecklist before coding:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eProgram exists in DHIS2 metadata\u003c/li\u003e\u003cli\u003eProgram stage(s) exist\u003c/li\u003e\u003cli\u003eRequired tracked entity attributes exist\u003c/li\u003e\u003cli\u003eRequired data elements exist\u003c/li\u003e\u003cli\u003eProgram is assigned to expected org units\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eHow to verify before coding:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eConfirm IDs in DHIS2 metadata (Program, Program Stage, TEAs, DEs).\u003c/li\u003e\u003cli\u003eConfirm the same IDs are placed in:\u003c/li\u003e\u003cli\u003esrc/extensions/tracker/const.js\u003c/li\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/const.js\u003c/li\u003e\u003cli\u003eStart app and verify program appears in selector after metadata bootstrap.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eStep 9 - Manually Verify the New Program\u003c/h3\u003e\u003cp\u003eManual verification checklist:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eOpen Tracker page\u003c/li\u003e\u003cli\u003eSelect ANC program\u003c/li\u003e\u003cli\u003eCreate enrollment\u003c/li\u003e\u003cli\u003eUpdate profile\u003c/li\u003e\u003cli\u003eCreate event\u003c/li\u003e\u003cli\u003eEdit event\u003c/li\u003e\u003cli\u003eVerify data saved in DHIS2\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePractical validation points:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eEnrollment creates expected initial data\u003c/li\u003e\u003cli\u003eProfile save persists TEA values\u003c/li\u003e\u003cli\u003eStage rules trigger expected hide/disable/error behavior\u003c/li\u003e\u003cli\u003eEvent save and complete/incomplete flows work correctly\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eCommon Mistakes\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eForgot to register ANC in src/extensions/tracker/programs/programConfig.js\u003c/li\u003e\u003cli\u003eWrong Program Stage ID in anc const.js\u003c/li\u003e\u003cli\u003eWrong Data Element ID mapping in anc const.js\u003c/li\u003e\u003cli\u003eMissing rule registration in programConfig\u003c/li\u003e\u003cli\u003eProgram ID in ALL_PROGRAMS does not match DHIS2 metadata\u003c/li\u003e\u003cli\u003eProgram not added to src/extensions/tracker/hooks/useSearchChr.jsx for CHR-linked flows\u003c/li\u003e\u003cli\u003eprofileSaveMethod is not set to chrProfileSave for CHR-linked flows\u003c/li\u003e\u003cli\u003eCopied PNC imports still pointing to pnc paths\u003c/li\u003e\u003cli\u003eEnrollment payload still using PNC stage/data element constants\u003c/li\u003e\u003cli\u003eMetadata missing in DHIS2 (program/stage/TEA/DE not available)\u003c/li\u003e\u003c/ul\u003e"};

function showHandbook(){window.currentView='handbook';window.handbookSelection=null;navActive('navDeveloper');document.getElementById('app').innerHTML=`<div class="page"><div class="breadcrumb">${t('home')} / <a href="#" onclick="showDevelopments();return false">${t('developmentsTitle')}</a> / ${t('handbookTitle')}</div><div class="subhead"><div><h1>${t('handbookTitle')}</h1><p>${t('handbookIntro')}</p></div><button class="btn" onclick="showDevelopments()">${t('backDevelopments')}</button></div><p class="handbook-source-note">${t('handbookContentEnglish')}</p><h2 class="section-title">${t('handbookTopics')}</h2><div class="handbook-grid">${handbookChapters.map(ch=>`<article class="card handbook-card"><div class="status">${ch.id==='readme'?t('handbookOverview'):`${String(handbookChapters.indexOf(ch)).padStart(2,'0')}`}</div><h3>${escapeHtml(ch.title)}</h3><p>${escapeHtml(ch.purpose)}</p><button class="btn primary" onclick="showHandbookDocument('${ch.id}')">${t('handbookRead')}</button></article>`).join('')}</div><div class="footer"><span>${t('pilotFooter')}</span><span>${t('footerTag')}</span></div></div>`}
function showHandbookDocument(id){const chapter=handbookChapters.find(x=>x.id===id);if(!chapter)return showHandbook();window.currentView='handbookDoc';window.handbookSelection=id;navActive('navDeveloper');document.getElementById('app').innerHTML=`<div class="page"><div class="breadcrumb">${t('home')} / <a href="#" onclick="showDevelopments();return false">${t('developmentsTitle')}</a> / <a href="#" onclick="showHandbook();return false">${t('handbookTitle')}</a> / ${escapeHtml(chapter.title)}</div><div class="subhead"><div><h1>${escapeHtml(chapter.title)}</h1><p>${escapeHtml(chapter.purpose)}</p></div><button class="btn" onclick="showHandbook()">${t('handbookBack')}</button></div><article class="handbook-content">${handbookDocuments[id]}</article><div class="footer"><span>${t('pilotFooter')}</span><span>${t('footerTag')}</span></div></div>`}

function showDeveloperPaths(){window.currentView='developer';window.developerSelection=null;navActive('navDeveloper');document.getElementById('app').innerHTML=`<div class="page"><div class="breadcrumb">${t('home')} / <a href="#" onclick="showDevelopments();return false">${t('developmentsTitle')}</a> / ${t('developerLearning')}</div><div class="subhead"><div><h1>${t('developerLearning')}</h1><p>${t('developerIntro')}</p></div><div class="annex-actions"><button class="btn primary" onclick="showAnnex()">${t('annexBrowse')}</button><button class="btn" onclick="showDevelopments()">${t('backDevelopments')}</button></div></div><div class="program-grid">${developerPaths.map(p=>`<section class="program"><div><div class="status">${t('requirements')}</div><h3>${t(p.title)}</h3><p>${t(p.task)}</p></div><button class="btn primary" onclick="showDeveloperPath('${p.id}')">${t('openProgram')}</button></section>`).join('')}</div><div class="notice">${t('developerNote')}</div><div class="footer"><span>${t('pilotFooter')}</span><span>${t('footerTag')}</span></div></div>`}
function renderCompetency(skill){const clean=skill.replace(' (Optional)','');const m=clean.match(/^([TDG][1-6])\s*[–-]\s*(.*)$/);return m?`<a class="competency-link" href="#" onclick="window.developerSelection='${window.developerSelection||''}';showAnnex('${m[1]}');return false"><strong>${m[1]}</strong></a> – ${escapeHtml(m[2])}${skill.includes('(Optional)')?` <em>(${t('optionalLabel')})</em>`:''}`:escapeHtml(clean)}
function showDeveloperPath(id){window.currentView='developerDetail';window.developerSelection=id;navActive('navDeveloper');const p=developerPaths.find(x=>x.id===id);if(!p)return showDeveloperPaths();const sections=p.sections.map(sec=>`<section class="competency-section"><h3>${sec.label[lang]||sec.label.en}</h3><ul>${sec.skills.map(skill=>`<li>${renderCompetency(skill)}</li>`).join('')}</ul></section>`).join('');document.getElementById('app').innerHTML=`<div class="page"><div class="breadcrumb">${t('home')} / <a href="#" onclick="showDevelopments();return false">${t('developmentsTitle')}</a> / <a href="#" onclick="showDeveloperPaths();return false">${t('developerLearning')}</a> / ${t(p.title)}</div><div class="subhead"><div><h1>${t(p.title)}</h1><p>${t(p.task)}</p></div><button class="btn" onclick="showDeveloperPaths()">${t('backPaths')}</button></div><section class="card developer-detail"><h2>${t('requirements')}</h2><p class="annex-hint">${t('annexCodeHint')}</p>${sections}${p.remark?`<div class="notice">${t('advancedRemark')}</div>`:''}${p.handbook?`<section class="handbook-placeholder"><div class="status">${t('futureHandbook')}</div><h3>iCapture Developer Handbook</h3><p>${t('handbookPlaceholder')}</p></section>`:''}</section><div class="footer"><span>${t('pilotFooter')}</span><span>${t('footerTag')}</span></div></div>`}

function showPlaceholder(kind){window.currentView='placeholder';navActive(null);const key='updates';document.getElementById('app').innerHTML=`<div class="page"><div class="breadcrumb">${t('home')} / ${t(key+'Title')}</div><div class="card" style="max-width:820px;margin:40px auto;text-align:center;padding:50px 30px"><div class="icon" style="margin:0 auto 16px">i</div><h2 style="color:#173a67;margin:0 0 10px">${t(key+'Title')}</h2><p style="color:#6a7b90;line-height:1.6">${t(key+'Msg')}</p><button class="btn primary" onclick="showHome()">${t('backToHome')}</button></div></div>`}
function startLesson(){activeLesson='entry';activeEntryType='communicable';current='SUR-DE-001';activePath=null;renderLesson()}
function startMalariaLesson(){activeLesson='entry';activeEntryType='malaria';current='SUR-DE-MAL-001';activePath=null;renderLesson()}
function startZeroCaseLesson(){activeLesson='entry';activeEntryType='zero';current='SUR-DE-ZCR-001';activePath=null;renderLesson()}
function startWeeklyReportLesson(){activeLesson='entry';activeEntryType='weekly';current='SUR-DE-WR-001';activePath=null;renderLesson()}
function startAnalysisLesson(){activeLesson='analysis';current='SUR-DA-001';activePath=null;renderLesson()}
function startReportLesson(){activeLesson='report';current='SUR-SR-001';activePath=null;renderLesson()}
function visibleSequence(){return lessonSteps().filter(s=>{if(activeLesson==='entry'&&s.group==='Patient Not Found')return activePath==='A';if(activeLesson==='entry'&&s.group==='Patient Found')return activePath==='B';return true}).map(s=>s.id)}
function shortNo(id){if(id.startsWith('SUR-DE-ZCR-')||id.startsWith('SUR-DE-WR-'))return String(Number(id.slice(-3)));if(id.startsWith('SUR-DE-MAL-')){const m=id.match(/^SUR-DE-MAL-(\d{3})([AB])?(?:-(\d{2}))?$/);return m?`${Number(m[1])}${m[2]?`${m[2]}.${Number(m[3])}`:''}`:id}if(id.startsWith('SUR-SR-')){const m=id.match(/^SUR-SR-(\d{3})(?:-(\d{2}))?$/);return m?`${Number(m[1])}${m[2]?`-${Number(m[2])}`:''}`:id.replace('SUR-SR-','')}if(id.startsWith('SUR-DA-')){const m=id.match(/^SUR-DA-(\d{3})(?:-(\d{2}))?$/);return m?`${Number(m[1])}${m[2]?`-${Number(m[2])}`:''}`:id.replace('SUR-DA-','')}const m={'SUR-DE-010A-01':'10A.1','SUR-DE-010A-02':'10A.2','SUR-DE-010A-03':'10A.3','SUR-DE-010A-04':'10A.4','SUR-DE-010A-05':'10A.5','SUR-DE-010B-01':'10B.1','SUR-DE-010B-02':'10B.2','SUR-DE-014-01':'14.1','SUR-DE-014-02':'14.2','SUR-DE-014-03':'14.3','SUR-DE-014-04':'14.4'};return m[id]||id.replace('SUR-DE-','')}
function renderSidebar(){const malariaOrder=['Main workflow','Decision point','Patient Not Found','Patient Found','Enter Surveillance 2.0 Data','Stage 1: Notification','Stage 2: Investigation & Classification','Stage 3: Follow-up','Stage 4: HH & Neighbourhood Response','Finish'];const entryOrder=activeEntryType==='malaria'?malariaOrder:activeEntryType==='zero'||activeEntryType==='weekly'?['Main workflow','Finish']:['Main workflow','Decision point','Patient Not Found','Patient Found','Enter Surveillance 2.0 Data','Data entry form','Finish'];const order=activeLesson==='analysis'?['Data Visualiser','Select Visualization Type','Determine Data','Determine Period','Determine Organisation Units','Finish']:activeLesson==='report'?['Reports App','Select Standard Report','Configure Report Parameters','Generate Report','Finish']:entryOrder;const groups=Object.fromEntries(order.map(g=>[g,[]]));for(const s of lessonSteps()){if(activeLesson==='entry'&&s.group==='Patient Not Found'&&activePath!=='A')continue;if(activeLesson==='entry'&&s.group==='Patient Found'&&activePath!=='B')continue;if(groups[s.group])groups[s.group].push(s.id)}let host='';for(const g of order){const ids=groups[g];if(!ids.length)continue;host+=`<div class="group-title">${t(groupKey[g]||g)}</div>`;for(const id of ids){const s=stepById(id);const branch=activeLesson==='entry'&&(s.group==='Patient Not Found'||s.group==='Patient Found');host+=`<button class="step ${id===current?'active ':''}${branch?'branch':''}" onclick="selectStep('${id}')"><span class="num">${shortNo(id)}</span><span>${title(s)}</span></button>`}}document.getElementById('stepList').innerHTML=host;const sb=document.querySelector('.sidebar'),act=document.querySelector('.step.active');if(sb&&act){const item=act.getBoundingClientRect(),box=sb.getBoundingClientRect();if(item.top<box.top)sb.scrollTop-=box.top-item.top;else if(item.bottom>box.bottom)sb.scrollTop+=item.bottom-box.bottom}}
function renderLesson(){const isAnalysis=activeLesson==='analysis',isReport=activeLesson==='report',isEntry=activeLesson==='entry',isMalaria=isEntry&&activeEntryType==='malaria',isZero=isEntry&&activeEntryType==='zero',isWeekly=isEntry&&activeEntryType==='weekly',lessonName=isEntry?t(isWeekly?'weeklyLessonTitle':isZero?'zeroLessonTitle':isMalaria?'malariaLessonTitle':'communicableLessonTitle'):t(isAnalysis?'dataAnalysis':'standardReports'),lessonSubtitle=isEntry?t(isWeekly?'weeklyLessonSub':isZero?'zeroLessonSub':isMalaria?'malariaLessonSub':'communicableLessonSub'):t('lessonSub'),lessonIntro=isEntry?t(isWeekly?'weeklyLessonIntro':isZero?'zeroLessonIntro':isMalaria?'malariaLessonIntro':'communicableLessonIntro'):t('lessonIntro'),s=stepById(current),seq=visibleSequence(),idx=seq.indexOf(current),isComplete=current===(isAnalysis?'SUR-DA-011':isReport?'SUR-SR-012':isMalaria?'SUR-DE-MAL-039':isZero?'SUR-DE-ZCR-013':isWeekly?'SUR-DE-WR-013':'SUR-DE-016');document.getElementById('app').innerHTML=`<div class="lesson-layout"><aside class="sidebar"><div class="crumb">${isAnalysis?DA_T[lang].lessonCrumb:isReport?SR_T[lang].lessonCrumb:t('lessonCrumb')}</div><div class="lesson-title">${lessonName}</div><div class="lesson-sub">${lessonSubtitle}</div><div class="progress"><i id="progressBar"></i></div><div id="stepList"></div><div class="footer-note">${isAnalysis?DA_T[lang].versionPilot:isReport?SR_T[lang].versionPilot:t('versionPilot')}</div></aside><main class="lesson-main"><section class="lesson-hero"><h1>${lessonName}</h1><p>${lessonIntro}</p></section><div class="toolbar"><span class="badge">${groupKey[s.group]?t(groupKey[s.group]):s.group}</span><span class="counter">${isComplete?t('lessonCompleted'):`Step ${Math.max(1,idx+1)} of ${seq.length-1}`}</span></div><section class="content" id="lessonContent"></section></main></div>`;
const c=document.getElementById('lessonContent');if(isComplete){const summary=isAnalysis||isReport||isMalaria||isZero||isWeekly?'':`<div class="summary-list"><ul>${['SUR-DE-002','SUR-DE-005','SUR-DE-006','SUR-DE-007','SUR-DE-008','SUR-DE-010A-01','SUR-DE-010B-01','SUR-DE-011','SUR-DE-012','SUR-DE-015'].map(id=>`<li>${title(byId[id])}</li>`).join('')}</ul></div>`;const completeTitle=isWeekly?t('weeklyCompletedTitle'):isZero?t('zeroCompletedTitle'):isMalaria?t('malariaCompletedTitle'):t('completedTitle'),completeText=isAnalysis?DA_T[lang].completedText:isReport?SR_T[lang].completedText:isWeekly?t('weeklyCompletedText'):isZero?t('zeroCompletedText'):isMalaria?t('malariaCompletedText'):(lang==='en'?s.ien:s.ilo),restartAction=isWeekly?'startWeeklyReportLesson()':isZero?'startZeroCaseLesson()':isMalaria?'startMalariaLesson()':isAnalysis?'startAnalysisLesson()':isReport?'startReportLesson()':'startLesson()',restartLabel=isWeekly?t('restartWeekly'):isZero?t('restartZero'):isMalaria?t('restartMalaria'):isAnalysis?DA_T[lang].startAnalysisAgain:isReport?SR_T[lang].startReportAgain:t('restart'),backAction=isEntry?'showDataEntryModules()':'showAreas()';c.innerHTML=`<div class="completion"><div class="check">✓</div><h3>${completeTitle}</h3><p>${completeText}</p>${summary}<button class="btn primary" onclick="${restartAction}">${restartLabel}</button><button class="btn" style="margin-left:8px" onclick="${backAction}">${t('backProgram')}</button></div>`;}
else{let extra='';if(isEntry&&s.group==='Decision point')extra=`<div class="branchbox"><strong>${t('searchResults')}</strong><div class="branch-options"><button class="branch-btn" onclick="choosePath('B')"><strong>${t('found')}</strong><span>${t('foundAction')}</span></button><button class="branch-btn" onclick="choosePath('A')"><strong>${t('notFound')}</strong><span>${t('notFoundAction')}</span></button></div></div>`;if(isEntry&&!isMalaria&&step14.includes(current))extra=`<div class="subtabs">${step14.map(id=>`<button class="subtab ${id===current?'active':''}" onclick="selectStep('${id}')">${id==='SUR-DE-014-01'?t('step14Basic'):id==='SUR-DE-014-02'?t('step14Symptoms'):id==='SUR-DE-014-03'?t('step14Specimens'):t('step14Vax')}</button>`).join('')}</div>`;const imgHtml=s.image?`<div class="image-wrap" onclick="openLightbox('${s.id}')" title="Click to enlarge"><img src="${s.image}" alt="${title(s)}"><span class="zoom-hint">Click to enlarge</span></div>`:`<div class="image-wrap"><div class="no-image">${t('noImage')}</div></div>`;const backAction=isEntry?'showDataEntryModules()':'showAreas()';c.innerHTML=`<div class="content-head"><h2>${title(s)}</h2><p>${instruction(s)}</p></div>${extra}${imgHtml}<div class="actionbar"><div class="left"><button class="btn" id="backBtn">${t('previous')}</button><button class="btn" onclick="${backAction}">${t('backProgram')}</button></div><div class="right"><button class="btn primary" id="nextBtn">${t('next')}</button></div></div>`;document.getElementById('backBtn').onclick=prev;document.getElementById('nextBtn').onclick=next;}
const denom=Math.max(1,seq.length-1);document.getElementById('progressBar').style.width=(Math.max(0,idx)/denom*100)+'%';renderSidebar()}
function choosePath(p){activePath=p;const a=activeEntryType==='malaria'?malariaBranchA:branchA,b=activeEntryType==='malaria'?malariaBranchB:branchB;current=p==='A'?a[0]:b[0];renderLesson()}
function selectStep(id){current=id;const s=stepById(id);if(s?.group==='Patient Not Found')activePath='A';if(s?.group==='Patient Found')activePath='B';renderLesson()}
function next(){const seq=visibleSequence(),i=seq.indexOf(current);if(i<seq.length-1){current=seq[i+1];renderLesson()}}
function prev(){const seq=visibleSequence(),i=seq.indexOf(current);if(i>0){current=seq[i-1];renderLesson()}}
setLang(lang);showHome();
</script>
