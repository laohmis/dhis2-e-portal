<!doctype html>
<html lang="lo">
<head>
<!-- Lao translations synchronized from user's provided translation workbook. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHIS2 eResources Learning | Learning &amp; Support Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   DESIGN TOKENS & BASE
   ========================================================================== */
:root {
  --navy: #1B3367;
  --blue: #1B3367;
  --blue2: #E3F2FD;
  --teal: #00796B;
  --bg: #F6F8FA;
  --card: #FFFFFF;
  --text: #212934;
  --muted: #4A5768;
  --border: #E3E9F0;
  --success: #2E7D32;
  --warn: #BB460D;
  --amber: #FFC928;
  --amber-tint: #F5EBD1;
  --shadow: 0 10px 24px rgba(9,51,113,.08);
  --flag-red: #CE1126;
  --flag-blue: #002868;
  --sky: #38B6FF;
  --amber-dark: #E5B01A;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: "Public Sans","Noto Sans Lao","Phetsarath OT","Saysettha OT",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color: var(--text);
  background: var(--bg);
  font-size: 15px;
  line-height: 1.55;
}

body { min-height: 100vh; background: var(--bg); }

button { font: inherit; }

.hidden { display: none !important; }

:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* ==========================================================================
   GLOBAL SIDEBAR  (collapsible icon rail on desktop, off-canvas drawer on mobile)
   ========================================================================== */
.gsb {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 272px;
  z-index: 50;
  display: flex;
  flex-direction: column;
  transition: width .3s ease,transform .3s ease;
  overflow: hidden;
  background: linear-gradient(180deg,#1B3367 0%,#172D5C 58%,#142951 100%);
  border-right: 1px solid rgba(255,255,255,.10);
  box-shadow: 0 12px 32px rgba(7,24,55,.22);
  color: #fff;
}

.ghead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  padding: 18px 12px 18px 16px;
  min-height: 80px;
  border-bottom: 1px solid rgba(255,255,255,.12);
}

.gbrand {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  min-width: 0;
  background: none;
  border: 0;
  color: inherit;
  padding: 0;
  text-align: left;
}

.logo {
  position: relative;
  width: 40px;
  height: 40px;
  min-width: 40px;
  flex: 0 0 40px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 10.5px;
  line-height: 1;
  letter-spacing: -.2px;
  white-space: nowrap;
}

.logo::after {
  content: "";
  position: absolute;
  right: -3px;
  bottom: -3px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--navy);
  background: #FFC928;
}

.gbrandtext { min-width: 0; }

.gbrandtext strong {
  display: block;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -.01em;
  line-height: 1.25;
  color: #fff;
}

.gbrandtext span { display: block; font-size: 11.5px; margin-top: 2px; line-height: 1.3; color: #C6D6EE; }

.gcollapse {
  flex: none;
  width: 28px;
  height: 32px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  transition: background .2s,color .2s;
  color: #C6D6EE;
}

.gcollapse:hover { background: rgba(255,255,255,.12); color: #fff; }

.gcollapse svg { transition: transform .3s; }

.gnav {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.gitem {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 14px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  text-align: left;
  transition: background .2s,color .2s,box-shadow .2s;
  color: #D3DEEF;
}

.gitem:hover { background: rgba(255,255,255,.10); color: #fff; }

.gitem svg { flex: none; transition: color .2s; color: #A7BEDF; }

.gitem:hover svg { color: #fff; }

.gitem.active {
  background: linear-gradient(90deg,#1B3367,#142951);
  color: #fff;
  box-shadow: 0 7px 16px rgba(0,0,0,.20),inset 0 0 0 1px rgba(255,201,40,.42);
}

.gitem.active svg { color: #fff; }

.gitem .gdot {
  margin-left: auto;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  opacity: 0;
  flex: none;
  background: #FFC928;
}

.gitem.active .gdot { opacity: 1; }

.gfoot { padding: 16px; border-top: 1px solid rgba(255,255,255,.12); }

.glang {
  display: flex;
  align-items: center;
  gap: 2px;
  border-radius: 999px;
  padding: 3px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.18);
}

.glang button {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 7px 10px;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
  color: #D3DEEF;
}

.glang button:hover { color: #fff; }

.glang button.active { font-weight: 800; background: #FFC928; color: #1B3367; }

.glang .short { display: none; }

.gburger {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 60;
  width: 42px;
  height: 42px;
  place-items: center;
  border: 0;
  border-radius: 10px;
  color: #fff;
  cursor: pointer;
  background: var(--navy);
  box-shadow: 0 6px 16px rgba(9,51,113,.35);
}

.gscrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }

#shell { margin-left: 272px; transition: margin-left .3s ease; }

.gburger .ix { display: none; }

body.sb-open .gburger .ix { display: block; }

body.sb-open .gburger .im { display: none; }

@media(min-width:1051px) {
  body.sb-collapsed .gsb { width: 80px; }
  body.sb-collapsed #shell, body.sb-lesson #shell { margin-left: 80px; }
  body.sb-collapsed .gcollapse svg { transform: rotate(180deg); }
  body.sb-collapsed .gbrandtext,
  body.sb-collapsed .glabel,
  body.sb-collapsed .gdot {
    display: none;
  }
  body.sb-collapsed .ghead { flex-direction: column; justify-content: center; padding: 14px 0; gap: 10px; }
  body.sb-collapsed .gitem { justify-content: center; padding: 12px 0; }
  body.sb-collapsed .gnav { padding: 16px 12px; }
  body.sb-collapsed .glang { flex-direction: column; border-radius: 14px; }
  body.sb-collapsed .glang .full { display: none; }
  body.sb-collapsed .glang .short { display: inline; }
  body.sb-collapsed .glang button { padding: 7px 0; width: 100%; }
  body.sb-collapsed .gfoot { padding: 12px; }
}

@media(max-width:1050px) {
  .gsb { width: 288px; transform: translateX(-100%); }
  body.sb-open .gsb { transform: none; }
  body.sb-open .gscrim { display: block; }
  .gburger { display: grid; }
  #shell { margin-left: 0; padding-top: 60px; }
  .gcollapse { display: none; }
  .ghead { padding-left: 68px; padding-right: 12px; }
}

/* ==========================================================================
   PAGE SHELL
   ========================================================================== */
.page { max-width: 1360px; margin: 0 auto; padding: 32px 32px 56px; }

/* ==========================================================================
   HOME HERO BANNER
   - Desktop (>=1351px): fixed proportion 1576 x 426 (matches the reference screenshot)
   - The photo is cropped to fit (cover), never stretched; it stays anchored right
   - Copy is vertically centered in the blue area; search stays in the top bar
   - To change the banner height, edit the aspect-ratio below
   ========================================================================== */
.hero {
  --hero-blue: 27,51,103;
  position: relative;
  isolation: isolate;
  z-index: 20;
  overflow: visible;
  display: grid;
  grid-template-columns: minmax(0,1.12fr) minmax(260px,.88fr);
  gap: clamp(22px,3vw,38px);
  align-items: center;
  min-height: 300px;
  padding: 22px clamp(36px,3.3vw,48px) 12px;
  border-radius: 18px;
  background-color: rgb(var(--hero-blue));
  background-image: url("assets/images/background-image/dhis2-training-banner-background.jpeg");
  background-repeat: no-repeat;
  background-size: cover;
  background-position: right center;
}
.hero-copy { position: relative; z-index: 2; grid-column: 1; min-width: 0; max-width: 660px; }
.hero h1 { margin: 0; color: #fff; font-size: 40px; line-height: 1.18; font-weight: 700; letter-spacing: -.01em; }
.hero p { margin: 16px 0 0; max-width: 600px; color: #DCE7F6; font-size: 17px; line-height: 1.6; }
.hero-search { position: relative; z-index: 30; max-width: 480px; margin-top: 22px; }

@media (min-width: 1051px) {
  .hero-copy { display: flex; flex-direction: column; justify-content: center; align-self: stretch; }
  .hero-search { margin-top: auto; }
  .hero h1 { font-size: clamp(34px,3.1vw,44px); line-height: 1.15; }
  html[lang="lo"] .hero h1 { font-size: clamp(32px,2.6vw,40px); }
  .hero p { margin-top: 18px; font-size: 18px; line-height: 1.55; }
}
@media (min-width: 1351px) {
  .hero { aspect-ratio: 1576 / 426; }
}
@media (max-width: 1050px) {
  .hero { min-height: 260px; padding: 24px 24px 20px; }
}
@media (max-width: 900px) {
  .hero { grid-template-columns: minmax(0,1fr); }
  .hero-copy { max-width: 58%; }
}
@media (max-width: 700px) {
  .hero { min-height: 0; padding: 22px 18px 18px; border-radius: 14px; background-position: 72% center; }
  .hero-copy { max-width: 100%; }
  .hero h1 { font-size: 30px; }
  .hero p { margin-top: 11px; font-size: 15px; line-height: 1.5; }
}

/* ==========================================================================
   HERO SEARCH FIELD & SUGGESTIONS
   ========================================================================== */
.hero-search-box {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border-radius: 12px;
  padding: 13px 16px;
  box-shadow: 0 10px 24px rgba(5,16,35,.25);
}

.hero-search-box svg {
  width: 19px;
  height: 19px;
  flex: none;
  stroke: var(--muted);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hero-search-box input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  font: inherit;
  font-size: 14.5px;
  color: var(--text);
}

.hero-search-box input::placeholder { color: #8E97A3; }

.search-results {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 8px);
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 16px 32px rgba(5,16,35,.3);
  overflow: hidden;
  max-height: min(320px, calc(100vh - 180px));
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  z-index: 40;
}

.search-result {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 12px 16px;
  font: inherit;
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
  border-bottom: 1px solid var(--border);
}

.search-result:last-child { border-bottom: 0; }

.search-result:hover { background: var(--blue2); }

.search-empty { padding: 14px 16px; font-size: 13.5px; color: var(--muted); }

/* ==========================================================================
   SECTION HEADINGS, CARDS & PROGRAM TILES
   ========================================================================== */
.section-title {
  font-size: 23px;
  color: var(--navy);
  margin: 42px 0 18px;
  font-weight: 700;
  letter-spacing: -.01em;
}

.cards { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 18px; align-items: stretch; }

.program-grid, .area-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 18px; }

.data-entry-modules { grid-template-columns: repeat(2,minmax(0,1fr)); }

.data-entry-modules .area { min-height: 240px; }

.indicator-catalog { max-width: 1120px; margin: 0 auto; }
.indicator-intro { background: #f0f6fd; border: 1px solid #d9e6f5; border-left: 4px solid #f2bd35; border-radius: 10px; padding: 16px 18px; margin: 18px 0 22px; color: var(--text); line-height: 1.65; }
.indicator-panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.indicator-panel-head { padding: 20px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: end; justify-content: space-between; gap: 18px; }
.indicator-panel-head h2 { margin: 0 0 5px; color: var(--navy); font-size: 21px; }
.indicator-panel-head p { margin: 0; color: var(--muted); }
.indicator-search { width: min(100%, 360px); min-height: 44px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text); padding: 10px 13px; font: inherit; }
.indicator-groups { padding: 0 22px; }
.indicator-group-title { margin: 0 -22px; padding: 12px 22px; color: #244675; background: #edf3fb; border-bottom: 1px solid var(--border); font-weight: 700; }
.indicator-row { display: grid; grid-template-columns: 58px minmax(0,1fr); align-items: start; gap: 14px; padding: 15px 4px; border-bottom: 1px solid #e8edf4; }
.indicator-row:last-child { border-bottom: 0; }
.indicator-row[hidden] { display: none; }
.indicator-number { width: 42px; height: 36px; display: grid; place-items: center; border-radius: 8px; background: #f3f6fa; color: #536782; font-weight: 700; font-variant-numeric: tabular-nums; }
.indicator-row.is-example { background: #fffaf0; }
.indicator-row.is-example .indicator-number { background: #ffedbd; color: #77510d; }
.indicator-row-content { min-width: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.indicator-name { color: var(--text); line-height: 1.65; }
.indicator-inline-link { margin-top: 12px; }
.indicator-example { flex: 0 0 auto; border-radius: 999px; background: #fff0c7; color: #77510d; padding: 4px 10px; font-size: 12px; font-weight: 700; line-height: 1.5; }
.indicator-actions { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 18px 22px; border-top: 1px solid var(--border); }
.indicator-empty { display: none; padding: 18px 4px; color: var(--muted); }

.card, .program, .area {
  --c: #1B3367;
  --ct: #E3F2FD;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.c-blue { --c: #1B3367; --ct: #E4F3FD; }

.c-teal { --c: #00796B; --ct: #E0F2F1; }

.c-amber { --c: #9E6A0A; --ct: #FFF1D4; }

.c-coral { --c: #BB460D; --ct: #FBE4D6; }

.program>div:first-child { flex: 1; width: 100%; }

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 18px;
  width: 100%;
}

.icon {
  width: 46px;
  height: 46px;
  border-radius: 10px;
  background: var(--ct);
  display: grid;
  place-items: center;
  font-size: 22px;
  margin-bottom: 16px;
}

.card-top .icon { margin-bottom: 0; }

.card h3, .program h3, .area h3 {
  margin: 0 0 8px;
  color: var(--navy);
  font-size: 18px;
  font-weight: 700;
  line-height: 1.3;
}

.card p, .program p, .area p { color: var(--muted); line-height: 1.6; font-size: 14.5px; margin: 0 0 20px; flex: 1; }

.cards>.home-card { min-height: 260px; }

.cards>.home-card .btn { margin-top: auto; }

.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 11px;
  border-radius: 7px;
  background: #E1F0E6;
  color: #1E6B41;
  font-size: 12.5px;
  font-weight: 700;
  margin: 0 0 12px;
}

.card-top .status { margin: 0; }

.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.soon .status { background: var(--amber-tint); color: #7A5A14; }

.soon .icon { background: #EEEDE4; filter: grayscale(1); opacity: .75; }

.soon h3 { color: #5B6358; }

/* ==========================================================================
   BUTTONS, NOTICES & FOOTER
   ========================================================================== */
.btn {
  border: 1.5px solid var(--border);
  background: #fff;
  color: var(--navy);
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s,filter .15s;
}

.btn:hover { background: var(--blue2); }

.btn.primary { background: var(--c,var(--blue)); border-color: var(--c,var(--blue)); color: #fff; }

.btn.primary:hover { filter: brightness(.92); background: var(--c,var(--blue)); }

.btn.accent {
  background: var(--amber);
  border-color: var(--amber);
  color: var(--navy);
  font-weight: 700;
  font-size: 14.5px;
  padding: 12px 26px;
}

.btn.accent:hover { background: var(--amber-dark); border-color: var(--amber-dark); filter: none; }

.btn.disabled { color: #8B9184; background: #EEEDE4; border-color: #E1DDCC; cursor: not-allowed; }

.btn.disabled:hover { background: #EEEDE4; }

.notice {
  margin-top: 24px;
  border-radius: 10px;
  padding: 16px 22px;
  font-size: 14px;
  line-height: 1.6;
  background: var(--amber-tint);
  color: #6E5212;
}

.footer {
  margin-top: 40px;
  padding: 20px 0 0;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  gap: 20px;
}

/* ==========================================================================
   BREADCRUMBS & SUB-HEADERS
   ========================================================================== */
.breadcrumb { font-size: 13px; color: var(--muted); margin-bottom: 10px; }

.subhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 10px 0 24px; }

.subhead h1 {
  margin: 0;
  color: var(--navy);
  font-size: 30px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -.01em;
}

.subhead p { margin: 6px 0 0; color: var(--muted); font-size: 15.5px; }

.subhead>.btn { flex: none; white-space: nowrap; }

/* ==========================================================================
   LESSON PLAYER  (step list, instruction panel, screenshot)
   ========================================================================== */
.lesson-layout { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }

.sidebar {
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 24px 18px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: auto;
}

.crumb { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

.lesson-title { font-size: 21px; font-weight: 700; color: var(--navy); letter-spacing: -.01em; }

.lesson-sub { font-size: 14px; color: var(--muted); margin: 4px 0 16px; }

.progress { height: 6px; background: var(--blue2); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }

.progress i {
  display: block;
  height: 100%;
  background: var(--amber);
  border-radius: 999px;
  width: 0;
  transition: width .25s;
}

.group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--navy);
  padding: 14px 8px 6px;
  text-transform: none;
}

.group-title::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--amber);
  flex: none;
}

.step {
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 9px 10px;
  margin: 2px 0;
  border-radius: 8px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  cursor: pointer;
  color: #3B4538;
  font-size: 13px;
  line-height: 1.4;
}

.step:hover { background: var(--blue2); }

.step.active {
  background: var(--blue2);
  color: var(--navy);
  font-weight: 700;
  box-shadow: inset 2px 0 0 var(--amber);
}

.step .num {
  min-width: 26px;
  width: auto;
  height: 26px;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--bg);
  color: var(--muted);
  display: grid;
  place-items: center;
  flex: none;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.step.active .num { background: var(--navy); color: #fff; }

.step.branch { padding-left: 28px; }

.step.branch .num { min-width: 22px; width: auto; height: 22px; padding: 0 6px; font-size: 10px; }

.footer-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 18px; }

.lesson-main { padding: 30px 34px 44px; min-width: 0; height: 100vh; overflow-y: auto; }

.lesson-hero {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--amber);
  border-radius: 10px;

.content { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: none; }

.content-head { padding: 22px 26px 18px; border-bottom: 1px solid var(--border); border-radius: 12px 12px 0 0; }

.image-wrap {

}

/* ==========================================================================
   SCREENSHOT LIGHTBOX
   ========================================================================== */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(10,25,42,.86);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 28px;
  z-index: 1000;
}

.lightbox.open { display: flex; }

.lightbox-panel {
  position: relative;
  width: min(96vw,1600px);
  height: min(94vh,1100px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.lightbox img {
  max-width: 100%;
  max-height: calc(100% - 52px);
  width: auto;
  height: auto;
  display: block;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 18px 50px rgba(0,0,0,.35);
  background: #fff;
}

.lightbox-caption {
  margin-top: 10px;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  max-width: 90%;
  text-shadow: 0 1px 2px rgba(0,0,0,.35);
}

.lightbox-close {
  position: absolute;
  right: 0;
  top: 0;
  width: 42px;
  height: 42px;
  border: 1px solid rgba(255,255,255,.45);
  background: rgba(255,255,255,.12);
  color: #fff;
  border-radius: 50%;
  font-size: 25px;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
}

.lightbox-close:hover { background: rgba(255,255,255,.2); }

@media(max-width:700px) {

}

/* ==========================================================================
   OPTION 1 — MODERN & CLEAN PORTAL (October 2026)
   Visual improvements are deliberately scoped to the portal shell and home page.
   Existing lesson data, English/Lao translations, routes and search stay intact.
   Only the top-bar search is displayed; the banner has no search field.

:root {

.lesson-layout.steps-collapsed .lesson-panel-toggle {
  width: 42px;
  height: 36px;
}
.lesson-layout.steps-collapsed .lesson-panel-toggle svg {
  transform: rotate(180deg);
}
.lesson-layout.steps-collapsed .sidebar .step,
.lesson-layout.steps-collapsed .sidebar .step.branch {
  width: 100%;
  min-height: 43px;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 5px 2px;
  margin: 3px 0;
  border-radius: 10px;
  border-left: 0;
}
.lesson-layout.steps-collapsed .sidebar .step .num,
.lesson-layout.steps-collapsed .sidebar .step.branch .num {
  width: auto;
  height: 34px;
  min-width: 35px;
  padding: 0 5px;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 750;
  letter-spacing: -.02em;
}
.lesson-layout.steps-collapsed .sidebar .step.active {
  background: #E5F0FE;
  box-shadow: inset 3px 0 var(--amber);
}
.lesson-layout.steps-collapsed .sidebar .step:focus-visible {
  outline-offset: -3px;
}
@media (max-width:1050px) {
  /* On tablet/phone the lesson panel sits above the content. Compact mode
     turns it into a horizontally-scrollable strip of numbered steps. */
  .lesson-layout.steps-collapsed {
    grid-template-columns: minmax(0,1fr);
    width: 100%;
  }
  .lesson-layout.steps-collapsed .sidebar {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    max-height: none;
    height: auto;
    padding: 9px 14px 10px;
    overflow: hidden;
  }
  .lesson-layout.steps-collapsed .lesson-panel-head {
    justify-content: flex-start;
    margin-bottom: 6px;
  }
  .lesson-layout.steps-collapsed #stepList {
    display: flex;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    scrollbar-width: thin;
    padding: 2px 1px 8px;
  }
  .lesson-layout.steps-collapsed .sidebar .step,
  .lesson-layout.steps-collapsed .sidebar .step.branch {
    flex: 0 0 auto;
    width: auto;
    min-width: 49px;
    margin: 0;
    padding: 3px 7px;
  }
  .lesson-layout.steps-collapsed .sidebar .step.active {
    box-shadow: inset 0 -3px var(--amber);
  }
}
/* ==========================================================================
   SCREENSHOT-FIRST LESSON VIEWER
   Remove the redundant upper module introduction from all step-by-step lessons.
   The module name remains in the lesson's own step navigation on the left.
   On desktop the image can grow into the newly available vertical space;
   object-fit:contain preserves the image aspect ratio without cropping.
   ========================================================================== */
@media (min-width:1051px) {
  .lesson-layout .lesson-main {
    padding: 10px 14px 12px;
    gap: 8px;
  }
  .lesson-layout .toolbar {
    min-height: 29px;
    flex: 0 0 auto;
  }
  .lesson-layout .content {
    min-height: 0;
    flex: 1 1 0;
    overflow: hidden;
  }
  .lesson-layout .content-head {
    padding: 11px 18px 10px;
  }
  .lesson-layout .content-head h2 {
    font-size: 20px;
  }
  .lesson-layout .image-wrap {
    flex: 1 1 0;
    min-height: 0;
    padding: 8px 10px;
    overflow: hidden;
  }
  .lesson-layout .image-wrap img {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    background: transparent;
    box-shadow: none;
  }
  .lesson-layout .actionbar {
    padding: 9px 14px;
    flex: 0 0 auto;
  }
}
@media (max-width:1050px) {
  .lesson-layout .lesson-main { padding: 12px; }
  .lesson-layout .content-head { padding: 15px 18px; }
  .lesson-layout .image-wrap { padding: 10px; }
  .lesson-layout .image-wrap img {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
    max-height: none;
    object-fit: contain;
  }
}
@media (max-width:700px) {
  .lesson-layout .toolbar { align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .toolbar-tools { flex: 1 1 100%; justify-content: space-between; gap: 8px; }
  .practice-tip { font-size: 11px; }
}
@media (prefers-reduced-motion:reduce) {
  .lesson-layout { transition: none; }
}


/* DHIS2 Updates article */
.updates-article { max-width: 1100px; margin: 24px auto 0; }
.updates-intro { margin: 0 0 24px; padding: 22px 24px; border-left: 4px solid #4b83bd; border-radius: 12px; background: #f1f6fc; color: #40536d; font-size: 16px; line-height: 1.75; }
.updates-intro a { color: #1e5a96; font-weight: 700; text-decoration: underline; }
.updates-article > h2 { margin: 0 0 16px; color: var(--navy); font-size: 22px; }
.updates-reasons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.updates-reason { padding: 22px; border: 1px solid #e3eaf3; border-radius: 16px; background: #fff; box-shadow: 0 8px 24px rgba(28, 58, 92, .06); }
.updates-reason h3 { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 12px; color: var(--navy); font-size: 18px; line-height: 1.45; }
.updates-number { display: inline-flex; flex: 0 0 28px; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #eaf2fb; color: #245d94; font-size: 14px; }
.updates-reason p { margin: 0 0 10px; color: #5f7085; line-height: 1.65; }
.updates-reason .updates-group-label { margin: 12px 0 4px; color: #354b66; font-weight: 700; }
.updates-reason ul { margin: 4px 0 12px; padding-left: 22px; color: #40536d; line-height: 1.7; }
.updates-reason li + li { margin-top: 3px; }
.updates-conclusion { margin: 22px 0; padding: 18px 22px; border: 1px solid #d6e7f8; border-radius: 12px; background: #f7fbff; color: #314b69; line-height: 1.7; }
.updates-sources { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-top: 16px; border-top: 1px solid #e3eaf3; color: #687b92; font-size: 13px; }
.updates-sources strong { color: #435873; }
.updates-sources a { color: #245d94; text-decoration: underline; }
@media (max-width: 760px) { .updates-reasons { grid-template-columns: 1fr; } .updates-intro { padding: 18px; } .updates-reason { padding: 18px; } }
</style>

  aboutTitle:'ກ່ຽວກັບ DHIS2 eResources',aboutIntro:'ແພລດຟອມດິຈິຕອນສຳລັບການຮຽນຮູ້ ແລະ ຄົ້ນຄວ້າອ້າງອີງການນຳໃຊ້ DHIS2 ພາກປະຕິບັດ ສຳລັບບຸກຄະລາກອນສາທາລະນະສຸກ, ຜູ້ນຳໃຊ້ສາຍງານ, ທີມງານສະໜັບສະໜູນ DHIS2 ແລະ ນັກພັດທະນາ.',aboutBackground:'ຄວາມເປັນມາ',aboutBackgroundText:'ກະຊວງສາທາລະນະສຸກ ແລະ ພາກສ່ວນຮ່ວມມືໃນ ສປປ ລາວ ນຳໃຊ້ DHIS2 ເພີ່ມຂຶ້ນ ເພື່ອຈັດການຂໍ້ມູນສາທາລະນະສຸກ, ເຝົ້າລະວັງພະຍາດ, ລາຍງານ ແລະ ວຽກງານສຸຂະພາບດິຈິຕອນອື່ນໆ. DHIS2 eResources ລວມຄູ່ມືສາຍງານ ແລະ ແຫຼ່ງຮຽນຮູ້ການພັດທະນາ DHIS2 ໄວ້ໃນບ່ອນດຽວ.',aboutProblem:'ບັນຫາທີ່ພົບ',aboutProblemIntro:'ຜູ້ນຳໃຊ້ອາດພົບຄວາມທ້າທາຍໃນການຮຽນຮູ້ແອັບ ແລະ ຂັ້ນຕອນໃໝ່ຂອງ DHIS2:',aboutProblemItems:['ຄົ້ນຫາຄູ່ມືທີ່ຖືກຕ້ອງໄດ້ຍາກ ເມື່ອເອກະສານກະຈາຍຢູ່ຫຼາຍບ່ອນ.','ຄູ່ມືແບບຂໍ້ຄວາມອາດບໍ່ສະແດງລຳດັບຂັ້ນຕອນໃນລະບົບຢ່າງຊັດເຈນ.','ຜູ້ນຳໃຊ້ມີຄວາມຄຸ້ນເຄີຍກັບ DHIS2 ຕ່າງກັນ ແລະ ໜ້າຈໍລະບົບອາດປ່ຽນແປງ.'],aboutPurpose:'ຈຸດປະສົງ',aboutPurposeText:'ສ້າງແພລດຟອມດິຈິຕອນສູນກາງ ເພື່ອໃຫ້ເຂົ້າເຖິງຄູ່ມື DHIS2 ພາກປະຕິບັດ, ແຫຼ່ງຮຽນຮູ້ສຳລັບນັກພັດທະນາ ແລະ ເອກະສານອ້າງອີງ. DHIS2 eResources ຊ່ວຍເສີມການອົບຮົມ, SOP, ຄູ່ມື ແລະ ເອກະສານອ້າງອີງທີ່ມີຢູ່.',aboutObjectives:'ຈຸດປະສົງສະເພາະ',aboutObjectiveItems:['ສະໜອງຄູ່ມືແບບຂັ້ນຕອນສຳລັບວຽກງານ DHIS2 ທົ່ວໄປ.','ໃຊ້ພາບໜ້າຈໍ DHIS2 ຈິງເພື່ອໃຫ້ເຂົ້າໃຈຄຳແນະນຳງ່າຍຂຶ້ນ.','ສະໜອງເນື້ອຫາການຮຽນຮູ້ທັງພາສາອັງກິດ ແລະ ພາສາລາວ.','ສ້າງສູນກາງສຳລັບ SOP, ເອກະສານອົບຮົມ ແລະ ເອກະສານອ້າງອີງ.','ເຮັດໃຫ້ເຂົ້າເຖິງ ແລະ ປັບປຸງເນື້ອຫາການຮຽນຮູ້ໄດ້ງ່າຍຂຶ້ນ.','ວາງໂຄງສ້າງທີ່ສາມາດຂະຫຍາຍໄປສູ່ໂຄງການ ແລະ ພາກການຮຽນຮູ້ອື່ນໆໄດ້.','ຈັດຕັ້ງ DHIS2 Developments ພ້ອມ DHIS2 Developer Learning Paths ແລະ iCapture Developer Handbook.'],aboutTargetUsers:'ກຸ່ມເປົ້າໝາຍ',aboutTargetUsersIntro:'ແພລດຟອມນີ້ມຸ່ງເນັ້ນໃຫ້ກຸ່ມຜູ້ນຳໃຊ້ຕໍ່ໄປນີ້:',aboutTargetUserItems:['ພະນັກງານສະຖານບໍລິການສາທາລະນະສຸກທີ່ນຳໃຊ້ DHIS2.','ພະນັກງານຂໍ້ມູນສາທາລະນະສຸກຂັ້ນເມືອງ.','ພະນັກງານຂໍ້ມູນສາທາລະນະສຸກຂັ້ນແຂວງ.','ເຈົ້າໜ້າທີ່ເຝົ້າລະວັງພະຍາດ.','ພະນັກງານສາຍງານທີ່ນຳໃຊ້ DHIS2.','ຜູ້ບໍລິຫານ ແລະ ທີມສະໜັບສະໜູນ DHIS2.','ຄູຝຶກ ແລະ ຫົວໜ້າຄວບຄຸມ.','ພະນັກງານກະຊວງ ແລະ ພາກສ່ວນຮ່ວມມືອື່ນໆທີ່ຕ້ອງການຄູ່ມື DHIS2.','ນັກພັດທະນາ DHIS2 ແລະ ທີມເຕັກນິກ ລວມທັງທີ function returnFromMchIndicatorCatalog() {
  const saved = window.mchIndicatorCatalogReturn;
  window.mchIndicatorCatalogReturn = null;
  if (saved && saved.fromLesson) {
    activeLesson = 'analysis';
    activeAnalysisType = saved.type;
    current = saved.current;
    renderLesson();
  } else {
    showMchDataAnalysisModules();
  }
}
function startMchAnalysisExample(type) {
  window.mchIndicatorCatalogReturn = null;
  if (type === 'delivery') startDeliveryAnalysisLesson();
  else startAncAnalysisLesson();
}
function filterMchIndicators(input) {
  const query = input.value.trim().toLocaleLowerCase();
  let visible = 0;
  document.querySelectorAll('[data-indicator-search]').forEach(row => {
    const match = row.dataset.indicatorSearch.includes(query);
    row.hidden = !match;
    if (match) visible++;
  });
  const empty = document.getElementById('indicatorSearchEmpty');
  if (empty) empty.style.display = visible ? 'none' : 'block';
}
function showMchIndicatorCatalog(type, returnToLesson = false) {
  const catalogType = type === 'delivery' ? 'delivery' : 'anc';
  const ui = MCH_INDICATOR_UI[lang === 'lo' ? 'lo' : 'en'];
  const items = MCH_INDICATORS[catalogType];
  window.currentView = 'mchIndicatorCatalog';
  window.mchIndicatorCatalogType = catalogType;
  window.mchIndicatorCatalogReturn = returnToLesson
    ? { fromLesson: true, type: activeAnalysisType, current }
    : null;
  navActive('navPrograms');
  const moduleTitle = catalogType === 'anc' ? t('mchAncTitle') : t('mchDeliveryTitle');
  const groupTitle = catalogType === 'anc' ? ui.ancGroup : ui.deliveryGroup;
  const list = items.map(([number, en, lo, isExample]) => {
    const searchText = `${number} ${en} ${lo}`.toLocaleLowerCase();
    return `<div class="indicator-row ${isExample ? 'is-example' : ''}" data-indicator-search="${escapeHtml(searchText)}"><div class="indicator-number">${number}</div><div class="indicator-row-content"><span class="indicator-name">${escapeHtml(lang === 'lo' ? lo : en)}</span>${isExample ? `<span class="indicator-example">${ui.example}</span>` : ''}</div></div>`;
  }).join('');
  const backLabel = window.mchIndicatorCatalogReturn?.fromLesson ? ui.backLesson : ui.backModules;
  document.getElementById('app').innerHTML = `<div class="page indicator-catalog"><div class="breadcrumb">${t('home')} / ${t('programGuidance')} / ${t('mchTitle')} / ${t('dataAnalysis')} / ${moduleTitle}</div><div class="subhead"><div><h1>${ui.catalogTitle}</h1><p>${moduleTitle}</p></div><button class="btn" onclick="returnFromMchIndicatorCatalog()">${backLabel}</button></div><div class="indicator-intro">${ui.intro}</div><section class="indicator-panel" aria-label="${ui.catalogTitle}"><div class="indicator-panel-head"><div><h2>${groupTitle}</h2><p>${items.length} ${ui.indicatorCount}</p></div><input class="indicator-search" type="search" placeholder="${ui.search}" aria-label="${ui.search}" oninput="filterMchIndicators(this)"></div><div class="indicator-groups"><div class="indicator-row indicator-group-title" aria-hidden="true"><span></span><span>${groupTitle}</span></div>${list}<div class="indicator-empty" id="indicatorSearchEmpty">${ui.empty}</div></div><div class="indicator-actions"><span>${ui.example} — ${catalogType === 'anc' ? '03' : '26'}</span><button class="btn primary" onclick="startMchAnalysisExample('${catalogType}')">${ui.startExample}</button></div></section><div class="footer"><span>${t('pilotFooter')}</span><span>${t('footerTag')}</span></div></div>`;
}

const SURV_ABOUT={"en": {"heading": "Diseases and Syndromes under the National Surveillance System of Lao PDR", "paras": ["Since around 2008, the Lao People’s Democratic Republic (Lao PDR) has been using the Early Warning and Response system (EWARN) as a key tool for national disease and syndrome surveillance. The main objective is to strengthen the surveillance system by providing a mechanism for data analysis, monitoring, and alerts for epidemiological events that require urgent attention.", "Lao-EWARN was introduced in phases, beginning at the national level and subsequently expanding to the provincial level. Under this system, data from various health service units were submitted to District Health Offices, where they were compiled and forwarded to Provincial Health Departments (PHDs) for entry into the EWARN database. The Provincial Health Departments then extracted the data, added aggregated figures, and forwarded them to the National Center for Laboratory and Epidemiology (NCLE). The data were subsequently entered into the Lao-EWARN system again for further analysis, and reports were disseminated to relevant stakeholders.", "The need to count, combine, aggregate, and enter data at each administrative level arose because the Lao-EWARN database was developed using Microsoft Access. As a result, it operated as a closed system and did not support online data backup. The data management and reporting process described above was largely decentralized and lacked a centralized approach to data management, increasing the risk of data discrepancies and potential data loss.", "Since 2015, Lao PDR has expanded the use of the District Health Information Software 2 (DHIS2) platform. This represented a shift towards a health information system that could be accessed and used by authorized health sector personnel across the country. DHIS2 provides a centralized data repository that allows users at different administrative levels to enter and access data, provided they have the necessary equipment, such as computers, and an internet connection. Authorized users can enter data from different locations and at any time, subject to system availability and access permissions. Furthermore, DHIS2 is designed to support timely and efficient data analysis and reporting. Data entered into the system can be automatically aggregated, analyzed, and presented in reports, reducing the time required for data processing.", "All diseases and syndromes under the national surveillance system require timely data collection and analysis to enable the early detection of disease patterns and potential outbreaks. These findings may trigger verification, investigation, and response activities. To support this objective, NCLE, in collaboration with the World Health Organization (WHO), began integrating surveillance data from the Lao-EWARN database into DHIS2 in 2018.", "The integration of these systems aligns with the Ministry of Health's Digital Health Strategy (2023–2027), which promotes DHIS2 as a national central platform for health information across disease programmes. The purpose of this integration guide is to reduce duplication of systems, improve data quality, and enable strategic decision-making by linking disease surveillance under the national surveillance system with malaria surveillance.", "This guide consolidates operational procedures from the National Center for Laboratory and Epidemiology (NCLE) and the Center of Malariology, Parasitology and Entomology (CMPE), focusing on the reporting of data for nationally surveilled diseases and malaria, respectively.", "The integration aims to establish standardized procedures for data entry, reporting, analysis, and monitoring within DHIS2. These procedures are intended to improve coordination, operational efficiency, and the use of surveillance data to support timely decision-making."], "ref": "References: Disease Surveillance 2.0 SOP"}, "lo": {"heading": "ພະຍາດ/ອາການພາຍໃຕ້ລະບົບການເຝົ້າລະວັງແຫ່ງ ສ ປປ ລາວ", "paras": ["ເລີ່ມແຕ່ປະມານປີ 2008, ສປປ ລາວ ໄດ້ເລີ່ມນຳໃຊ້ລະບົບການເຝົ້າລະວັງການເຕືອນ ແລະ ໂຕ້ຕອບແຕ່ຫົວທີໂດຍເປັນເຄື່ອງມືຫຼັກໃນວຽກງານເຝົ້າລະວັງພະຍາດ/ອາການແຫ່ງຊາດ. ຈຸດປະສົງຫຼັກແມ່ນເພື່ອເພີ່ມຄວາມເຂັ້ມແຂງໃຫ້ແກ່ລະບົບວຽກງານເຝົ້າລະວັງໂດຍການສະໜອງຊ່ອງທາງທີ່ເປັນໄປໄດ້ສຳລັບການວິເຄາະຂໍ້ມູນດ້ວຍວິທີການຕິດຕາມ ແລະ ແຈ້ງເຕືອນກ່ຽວກັບສະພາບການທີ່ຈຳເປັນທີ່ຕ້ອງການເອົາໃຈໃສ່ທີ່ຮີບດ່ວນຂອງລະບາດວິທະຍາ.", "Lao-EWARN ໄດ້ເລີ່ມດຳເນີນການເປັນເທື່ອລະກ້າວໂດຍເລີ່ມຈາກລະດັບປະເທດ ແລະ ຕໍ່ມາໃນລະດັບແຂວງ. ພາຍໃຕ້ການປະຕິບັດງານຂອງລະບົບດັ່ງກ່າວ, ບັນດາຂໍ້ມູນຈາກໜ່ວຍງານບໍລິການທາງດ້ານສາທາລະນະສຸກຕ່າງໆໄດ້ຖືກນຳສົ່ງໄປຍັງຫ້ອງການສາທາລະນະສຸກເມືອງເຊິ່ງໄດ້ມີການສັງລວມ ແລະ ຖືກສົ່ງຕໍ່ໄປພະແນກສາທາລະນະສຸກແຂວງເພື່ອປ້ອນເຂົ້າໃນລະບົບຖານຂໍ້ມູນ EWARN. ຫຼັງຈາກນັ້ນ, ພະແນກສາທາລະນະສຸກແຂວງໄດ້ນຳເອົາຂໍ້ມູນອອກມາບວກກັບໂຕເລກສັງລວມ ແລະ ສົ່ງໄປຍັງສູນວິເຄາະ ແລະ ລະບາດວິທະຍາເພື່ອຈະໄດ້ນຳເອົາຂໍ້ມູນເຂົ້າໃນລະບົບ Lao EWARN ອີກເທື່ອໜຶ່ງເພື່ອວິເຄາະເພີ່ມຕື່ມ ແລະ ສົ່ງລາຍງານໄປຍັງໜ່ວຍງານທີ່ກ່ຽວຂ້ອງ.", "ເຫດຜົນທີ່ຂໍ້ມູນຖືກນັບ, ປະສົມ, ສັງລວມ ແລະ ປ້ອນໃສ່ໃນແຕ່ລະຂັ້ນເພາະວ່າລະບົບຖານຂໍ້ມູນ Lao-Ewarn ໄດ້ຖືກພັດທະນາຢູ່ໃນໂປແກມ Microsoft Access. ດັ່ງນັ້ນ ມັນຈຶ່ງເປັນລະບົບປິດ ແລະ ບໍ່ສາມາດສຳຮອງຂໍ້ມູນຜ່ານອິນເຕີເນັດໄວ້ໄດ້. ລະບົບຂັ້ນຕອນການຈັດເກັບຂໍ້ມູນດັ່ງກ່າວມາຂ້າງເທີງນີ້ສ່ວນຫຼັກໆແມ່ນບໍ່ມີການຈັດການຂໍ້ມູນແບບເປັນແຫຼ່ງ, ດັ່ງນັ້ນຈຶ່ງເຮັດໃຫ້ຂໍ້ມູນມີການຄາດເຄື່ອນ ຫຼື ອາດເສຍຂໍ້ມູນໄປໄດ້.", "ນັບຕັ້ງແຕ່ປີ 2015 ສປປ ລາວ ໄດ້ມີການຂະຫຍາຍວຽກງານດ້ານລະບົບຖານຂໍ້ມູນ DHIS2. ນີ້ແມ່ນການໂອນຖ່າຍຂໍ້ມູນຂອງລະບົບຂໍ້ມູນສຸຂະພາບໂດຍມີຄວາມສາມາດເຂົ້າເຖີງ ແລະ ໃຫ້ບໍລິການແກ່ທຸກໆໜ່ວຍງານພາຍໃນປະເທດ. DHIS2 ແມ່ນແຫຼ່ງຈັດເກັບຂໍ້ມູນທີ່ທຸກໆຂັ້ນສາມາດນຳໃຊ້ ແລະ ບັນທຶກຂໍ້ມູນໃສ່ໄດ້ໂດຍປັດໃຈຫຼັກຕ້ອງມີເຄື່ອງມືເຊັ່ນ: ຄອມພີວເຕີ ແລະ ອິນເຕີເນັດ. ຖ້າຫາກວ່າບຸກຄົນໃດມີສິດເຂົ້ານຳໃຊ້ລະບົບຖານຂໍ້ມູນດັ່ງກ່າວບຸກຄົນນັ້ນກໍ່ສາມາດນຳໃຊ້ເພື່ອການປ້ອນຂໍ້ມູນໃນທຸກໆສະຖານທີ່ ແລະ ທຸກໆເວລາໄດ້. ຫຼາຍໄປກວ່ານັ້ນ, ດັ່ງທີ່ໂປແກມໂຕນີ້ຖືກອອກແບບມາໃຫ້ມີຄວາມສາມາດວິເຄາະ, ລາຍງານຂໍ້ມູນຢ່າງທັນການ ແລະ ມີປະສິດທິພາບ, ຂໍ້ມູນທີ່ຖືກປ້ອນເຂົ້າໃນລະບົບຈະສັງລວມໂຕເລກ, ວິເຄາະ, ລາຍງານໃຫ້ອັດຕະໂນມັດຢ່າງວ່ອງໄວ.", "ທຸກໆພະຍາດ/ອາການພາຍໃຕ້ລະບົບການເຝົ້າລະວັງຮຽກຮ້ອງໃຫ້ມີການເກັບກຳຂໍ້ມູນ ແລະ ວິເຄາະຂໍ້ມູນຕາມເວລາທີ່ເໝາະສົມເພື່ອຢືນຢັນຮູບແບບພະຍາດຢ່າງວ່ອງໄວເຊິ່ງອາດຈະຕ້ອງມີການກວດສອບ, ການສືບສວນ ແລະ ການຕອບໂຕ້. ດ້ວຍຈຸດປະສົງນີ້ສູນວິເຄາະ ແລະ ລະບາດວິທະຍາຮ່ວມມືກັບອົງການອະນາໄມໂລກເລີ່ມແຕ່ປີ 2018 ຂໍ້ມູນພະຍາດພາຍໃຕ້ລະບົບການເຝົ້າລະວັງຈາກຖານຂໍ້ມູນ LaoEwarn ຈຶ່ງໄດ້ຖືກນຳເຂົ້າສູ່ລະບົບຖານຂໍ້ມູນ DHIS2.", "ການເຊື່ອມສານທັງສອງໜ່ວຍງານແມ່ນສອດຄ່ອງກັບຍຸດທະສາດເທັກໂນໂລຊີດິຈິຕໍຂອງກະຊວງສາທາລະນະສຸກ ( 2023-2027 ) ເຊິ່ງສົ່ງເສີມໃຫ້ DHIS2 ເປັນລະບົບສູນລວມຂໍ້ມູນແຫ່ງຊາດສຳລັບຂໍ້ມູນດ້ານສຸຂະພາບໃນບັນດາໂຄງການພະຍາດຕ່າງໆ. ຈຸດປະສົງສຳລັບການສ້າງຄູ່ມືເຊື່ອມສານເຫຼັ້ມນີ້ເພື່ອຫຼຸດການນຳໃຊ້ລະບົບທີ່ຊ້ຳຊ້ອນ,ປັບປຸງຄຸນະພາບຂອງຂໍ້ມູນ, ແລະ ສາມາດຕັດສິນໃຈໄດ້ທາງດ້ານກົນລະຍຸດ (enable strategic decision-making) ລະຫວ່າງວຽກງານການເຝົ້າລະວັງພະຍາດພາຍໃຕ້ລະບົບການເຝົ້າລະວັງແຫ່ງຊາດ ແລະ ພະຍາດໄຂ້ມາລາເຣຍ.", "ເຊິ່ງໄດ້ຮວບຮວມຂັ້ນຕອນການດໍາເນີນງານຈາກສູນວິເຄາະ ແລະ ລະບາດວິທະຍາ (NCLE) ແລະ ສູນແມ່ກາຟາກ, ແລະ ແມງໄມ້ (CMPE), ໂດຍສຸມໃສ່ການລາຍງານຂໍ້ມູນພະຍາດເຝົ້າລະວັງ ແລະ ພະຍາດໄຂ້ມາເລເລຍຕາມລໍາດັບ.", "ການລວມເຂົ້າກັນມີຈຸດປະສົງທີ່ຈະສ້າງມາດຕະຖານຂັ້ນຕອນສໍາລັບການບັນທຶກຂໍ້ມູນ, ການລາຍງານ, ການວິເຄາະ ແລະ ການຄວບຄຸມໃນ DHIS2 ເພື່ອປັບປຸງການປະສານງານ, ປະສິດທິພາບ ແລະ ການນໍາໃຊ້ຂໍ້ມູນການເຝົ້າລະວັງເພື່ອການຕັດສິນໃຈທີ່ທັນເວລາ."], "ref": "ຂໍ້ມູນອ້າງອີງຈາກ: ປື້ມຄູ່ມືເຊື່ອມສານພະຍາດເຝົ້າລະວັງ 2.0 SOP"}};
function showProgramAbout(program) { if (program !== 'diseaseSurveillance') return showPrograms(); window.currentView = 'programAbout'; window.programAbout = program; navActive('navPrograms'); const isDisease = program === 'diseaseSurveillance', title = isDisease ? t('surveillanceTitle') : program === 'mch' ? t('mchTitle') : t(program === 'hiv' ? 'hivTitle' : 'tbTitle'), description = isDisease ? t('diseaseSurveillanceAbout') : t('aboutProgramFuture'), sa = SURV_ABOUT[lang] || SURV_ABOUT.en, body = isDisease ? `<h3 style="margin:6px 0 18px;color:#173a67;font-size:20px;line-height:1.5">${sa.heading}</h3>${sa.paras.map(x => `<p style="font-size:16.5px;line-height:1.85;color:#40536d;margin:0 0 16px">${x}</p>`).join('')}<p style="font-size:14px;line-height:1.7;color:#6a7b90;font-style:italic;margin:22px 0 0;padding-top:16px;border-top:1px solid #e3eaf3">${sa.ref}</p>` : `<p style="font-size:18px;line-height:1.75;color:#40536d">${description}</p>`, back = program === 'diseaseSurveillance' ? 'showAreas()' : program === 'mch' ? 'showMchAreas()' : `showOtherProgramAreas('${program}')`; document.getElementById('app').innerHTML = `<div class="page"><div class="breadcrumb">${t('home')} / ${t('programGuidance')} / ${title} / ${t('aboutProgram')}</div><div class="subhead"><div><h1>${t('aboutProgram')}</h1><p>${title}</p></div><button class="btn" onclick="${back}">${t('programsBtn')}</button></div><article class="card" style="max-width:900px;margin:28px auto;padding:32px"><h2>${title}</h2>${body}</article><div class="footer"><span>${t('pilotFooter')}</span><span>${t('footerTag')}</span></div></div>`; }

function hidePortalSearch(clear=false){
  const input=document.getElementById('homeSearch'),box=document.getElementById('homeSearchResults');
  if(input){input.setAttribute('aria-expanded','false');if(clear)input.value=''}
  if(box){box.classList.add('hidden');if(clear)box.innerHTML=''}
}
function onHomeSearchInput(v){
  const box=document.getElementById('homeSearchResults'),input=document.getElementById('homeSearch');if(!box)return;
  const q=v.trim().toLowerCase();if(!q){hidePortalSearch(true);return}
  const matches=searchIndex().filter(it=>it.label.toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=matches.length?matches.map(m=>`<button class="search-result" type="button" onclick="hidePortalSearch(true);${m.action}">${escapeHtml(m.label)}</button>`).join(''):`<div class="search-empty">${escapeHtml(t('searchNoResults'))}</div>`;
  box.classList.remove('hidden');if(input)input.setAttribute('aria-expanded','true');
}
function onHomeSearchKey(e){
  if(e.key==='Escape'){e.preventDefault();hidePortalSearch(true);e.target.blur()}
  else if(e.key==='Enter'){const first=document.getElementById('homeSearchResults')?.querySelector('.search-result');if(first){e.preventDefault();first.click()}}
}
document.addEventListener('click',function(e){const wrap=document.getElementById('homeSearchWrap');if(wrap&&!wrap.contains(e.target))hidePortalSearch()});
