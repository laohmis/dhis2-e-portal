<!doctype html>
<html lang="en">
<head>
<!-- Lao translations synchronized from user's provided translation workbook. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHIS2 E-Portal Learning - DHIS2 Developments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#093371;--blue:#147CD7;--blue2:#E3F2FD;--teal:#00695C;--bg:#F6F8FA;--card:#FFFFFF;--text:#212934;--muted:#4A5768;--border:#E3E9F0;--success:#2E7D32;--warn:#BB460D;
--amber:#C2922E;--amber-tint:#F5EBD1;--shadow:0 10px 24px rgba(9,51,113,.08);--flag-red:#CE1126;--flag-blue:#002868}
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:"Public Sans","Noto Sans Lao","Phetsarath OT","Saysettha OT",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg);font-size:15px;line-height:1.55}
body{min-height:100vh}button{font:inherit}.hidden{display:none!important}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* header */
header{height:76px;background:var(--card);border-bottom:1px solid var(--border);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:4px 28px 0;gap:18px;position:sticky;top:0;z-index:30}
header::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(to right,var(--flag-red) 0 33.33%,var(--amber) 33.33% 66.66%,var(--success) 66.66% 100%)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;min-width:290px}
.logo{position:relative;width:44px;height:44px;min-width:44px;flex:0 0 44px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--navy));display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;line-height:1;letter-spacing:-.2px;white-space:nowrap}
.logo::after{content:"";position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;background:var(--amber);border:2px solid var(--card)}
.brand strong{display:block;color:var(--navy);font-size:16px;font-weight:700;letter-spacing:-.01em}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.topnav{display:flex;gap:4px;flex:none;height:100%;align-items:center;justify-self:center}
.topnav button{border:2px solid transparent;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s,border-color .15s}
.topnav button:hover{background:var(--blue2);color:var(--navy)}
.topnav button.active{color:var(--navy);border-color:var(--blue);background:var(--blue2);box-shadow:inset 0 0 0 2px #fff;font-weight:700}
.lang-switch{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px;flex:none;justify-self:end}
.lang-switch button{border:0;background:transparent;padding:7px 13px;border-radius:999px;color:var(--muted);cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap}
.lang-switch button.active{background:#FFC928;color:var(--navy);font-weight:800}

/* home hero */
.page{max-width:1360px;margin:0 auto;padding:32px 32px 56px}
.hero{position:relative;overflow:hidden;background:var(--navy);border-radius:18px;padding:44px 48px;display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}
.hero h1{margin:0;color:#fff;font-size:40px;line-height:1.18;font-weight:700;letter-spacing:-.01em}
.hero p{font-size:17px;color:#C3D6EE;line-height:1.6;margin:16px 0 0;max-width:600px}
.pill{display:inline-flex;align-items:center;background:transparent;border:1px solid rgba(255,255,255,.35);color:#E8D7A6;border-radius:7px;padding:6px 13px;font-size:13px;font-weight:600;margin-bottom:20px}

.hero-art{height:270px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.screen{width:80%;height:74%;background:#fff;border-radius:10px;box-shadow:0 14px 30px rgba(5,14,10,.3);overflow:hidden}
.screen-bar{height:24px;background:var(--navy)}.screen-body{padding:12px;display:grid;grid-template-columns:26% 1fr;gap:10px;height:calc(100% - 24px)}
.screen-side{background:#EDF2F7;border-radius:8px;padding:8px}.screen-side div{height:10px;background:#D6E2EE;border-radius:4px;margin-bottom:7px}
.screen-main{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{border-radius:8px;background:var(--blue2)}
.tile:nth-child(2){background:#E0F2F1}.tile:nth-child(3){background:#F5EBD1}.tile:nth-child(4){background:#FBE4D6}.tile:nth-child(6){background:#E0F2F1}
.phone{position:absolute;right:7%;bottom:9%;width:84px;height:148px;border-radius:16px;background:#fff;box-shadow:0 12px 24px rgba(5,14,10,.35);padding:8px}
.phone .pbar{height:18px;background:var(--amber);border-radius:9px 9px 4px 4px}.phone .ptile{height:14px;background:var(--blue2);border-radius:5px;margin:7px 0}

/* sections, cards, program and area tiles */
.section-title{font-size:23px;color:var(--navy);margin:42px 0 18px;font-weight:700;letter-spacing:-.01em}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:stretch}
.program-grid,.area-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.data-entry-modules{grid-template-columns:repeat(2,minmax(0,1fr))}.data-entry-modules .area{min-height:240px}
.card,.program,.area{--c:#147CD7;--ct:#E3F2FD;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--c);border-radius:10px;padding:24px;box-shadow:none;display:flex;flex-direction:column;align-items:flex-start}
.c-blue{--c:#147CD7;--ct:#E3F2FD}.c-teal{--c:#00796B;--ct:#E0F2F1}.c-amber{--c:#C2922E;--ct:#F5EBD1}.c-coral{--c:#BB460D;--ct:#FBE4D6}
.program>div:first-child{flex:1;width:100%}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;width:100%}
.icon{width:46px;height:46px;border-radius:10px;background:var(--ct);display:grid;place-items:center;font-size:22px;margin-bottom:16px}
.card-top .icon{margin-bottom:0}
.card h3,.program h3,.area h3{margin:0 0 8px;color:var(--navy);font-size:18px;font-weight:700;line-height:1.3}
.card p,.program p,.area p{color:var(--muted);line-height:1.6;font-size:14.5px;margin:0 0 20px;flex:1}
.cards>.home-card{min-height:260px}.cards>.home-card .btn{margin-top:auto}
.status{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:7px;background:#E1F0E6;color:#1E6B41;font-size:12.5px;font-weight:700;margin:0 0 12px}.card-top .status{margin:0}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.soon .status{background:var(--amber-tint);color:#7A5A14}
.soon .icon{background:#EEEDE4;filter:grayscale(1);opacity:.75}.soon h3{color:#5B6358}

/* buttons */
.btn{border:1.5px solid var(--border);background:#fff;color:var(--navy);border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,filter .15s}
.btn:hover{background:var(--blue2)}
.btn.primary{background:var(--c,var(--blue));border-color:var(--c,var(--blue));color:#fff}.btn.primary:hover{filter:brightness(.92);background:var(--c,var(--blue))}
.btn.accent{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:700;font-size:14.5px;padding:12px 26px}.btn.accent:hover{background:#A47B26;filter:none}
.btn.disabled{color:#8B9184;background:#EEEDE4;border-color:#E1DDCC;cursor:not-allowed}.btn.disabled:hover{background:#EEEDE4}
.notice{margin-top:24px;background:var(--amber-tint);border-radius:10px;padding:16px 22px;color:#6E5212;font-size:14px;line-height:1.6}
.footer{margin-top:40px;padding:20px 0 0;border-top:1px solid var(--border);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:20px}
.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:10px}
.subhead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:10px 0 24px}
.subhead h1{margin:0;color:var(--navy);font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.01em}.subhead p{margin:6px 0 0;color:var(--muted);font-size:15.5px}

/* lesson */
.lesson-layout{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 68px)}
.sidebar{background:var(--card);border-right:1px solid var(--border);padding:24px 18px;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}
.crumb{font-size:12px;color:var(--muted);margin-bottom:14px}.lesson-title{font-size:21px;font-weight:700;color:var(--navy);letter-spacing:-.01em}.lesson-sub{font-size:14px;color:var(--muted);margin:4px 0 16px}
.progress{height:6px;background:var(--blue2);border-radius:999px;overflow:hidden;margin-bottom:18px}.progress i{display:block;height:100%;background:var(--amber);border-radius:999px;width:0;transition:width .25s}
.group-title{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--navy);padding:14px 8px 6px;text-transform:none}
.group-title::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
.step{width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;margin:2px 0;border-radius:8px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;color:#3B4538;font-size:13px;line-height:1.4}
.step:hover{background:var(--blue2)}.step.active{background:var(--blue2);color:var(--navy);font-weight:700;box-shadow:inset 2px 0 0 var(--amber)}
.step .num{width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--muted);display:grid;place-items:center;flex:none;font-size:11px;font-weight:700}.step.active .num{background:var(--navy);color:#fff}
.step.branch{padding-left:28px}.step.branch .num{width:22px;height:22px;font-size:10px}
.footer-note{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
.lesson-main{padding:30px 34px 44px;min-width:0;height:calc(100vh - 68px);overflow-y:auto}
.lesson-hero{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:10px;padding:22px 26px;margin-bottom:18px}
.lesson-hero h1{margin:0 0 6px;color:var(--navy);font-size:25px;font-weight:700;line-height:1.25;letter-spacing:-.01em}.lesson-hero p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.badge{padding:5px 13px;border-radius:7px;background:var(--amber-tint);color:#7A5A14;font-size:13px;font-weight:700}.counter{font-size:14px;color:var(--muted);font-weight:600}
.content{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:none}
.content-head{padding:22px 26px 18px;border-bottom:1px solid var(--border);border-radius:12px 12px 0 0}.content-head h2{margin:0 0 8px;font-size:22px;color:var(--navy);font-weight:700;line-height:1.3;letter-spacing:-.01em}.content-head p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.65;white-space:pre-line}
.image-wrap{background:#EEF3FB;padding:20px;min-height:260px;display:flex;align-items:center;justify-content:center}
.image-wrap{position:relative;cursor:zoom-in}
.image-wrap img{max-width:100%;max-height:640px;width:auto;height:auto;display:block;border:1px solid #d8dee7;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.08);background:#fff;transition:transform .15s ease,box-shadow .15s ease}
.image-wrap:hover img{box-shadow:0 10px 28px rgba(22,59,104,.16)}
.zoom-hint{position:absolute;right:28px;top:28px;background:rgba(22,48,43,.9);color:#fff;border-radius:7px;padding:7px 10px;font-size:11px;font-weight:700;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.16)}
.no-image{padding:70px;text-align:center;color:#8b99aa}
.lightbox{position:fixed;inset:0;background:rgba(10,25,42,.86);display:none;align-items:center;justify-content:center;padding:28px;z-index:1000}
.lightbox.open{display:flex}
.lightbox-panel{position:relative;width:min(96vw,1600px);height:min(94vh,1100px);display:flex;flex-direction:column;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:calc(100% - 52px);width:auto;height:auto;display:block;object-fit:contain;border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.35);background:#fff}
.lightbox-caption{margin-top:10px;color:#fff;font-size:13px;font-weight:700;text-align:center;max-width:90%;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.lightbox-close{position:absolute;right:0;top:0;width:42px;height:42px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:50%;font-size:25px;line-height:1;cursor:pointer;display:grid;place-items:center}
.lightbox-close:hover{background:rgba(255,255,255,.2)}
@media(max-width:700px){.lightbox{padding:14px}.lightbox-panel{width:100%;height:100%}.lightbox img{max-height:calc(100% - 44px)}.zoom-hint{right:24px;top:24px;font-size:10px}}

.actionbar{position:sticky;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-top:1px solid var(--border);background:var(--card);border-radius:0 0 12px 12px;box-shadow:none}.actionbar .left,.actionbar .right{display:flex;gap:10px;flex-wrap:wrap}
.branchbox{margin:18px 26px 22px;background:var(--amber-tint);border:1px solid #E3D2A0;border-radius:10px;padding:16px}.branchbox strong{color:#7A5A14;display:block;margin-bottom:6px}
.branch-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.branch-btn{border:1.5px solid #E3D2A0;background:#fff;border-radius:8px;padding:13px;text-align:left;cursor:pointer}.branch-btn:hover{border-color:var(--navy);background:var(--blue2)}
.branch-btn strong{display:block;color:var(--navy);margin:0 0 3px}.branch-btn span{font-size:13px;color:var(--muted)}
.subtabs{display:flex;flex-wrap:wrap;gap:8px;padding:0 26px 18px}.subtab{border:1.5px solid var(--border);background:#fff;border-radius:7px;padding:8px 14px;color:var(--navy);cursor:pointer;font-size:13px;font-weight:600}.subtab:hover{background:var(--blue2)}.subtab.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.completion{border-radius:12px;text-align:center;padding:44px 24px;background:var(--card);border:1px solid var(--border);border-top:3px solid var(--success)}.check{width:58px;height:58px;border-radius:50%;background:#E1F0E6;color:#1E6B41;display:grid;place-items:center;margin:0 auto 16px;font-size:26px;font-weight:700}
.completion h3{margin:0 0 8px;color:var(--navy);font-size:22px;font-weight:700}.completion p{margin:0 auto 18px;max-width:720px;color:var(--muted);line-height:1.6;font-size:15px}
.summary-list{max-width:760px;margin:18px auto;text-align:left;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px 22px}.summary-list li{margin:7px 0;color:var(--text);font-size:14px}

/* Resources page - visual design aligned with the approved reference */
.resources-page{background:transparent;max-width:1500px;margin:0 auto;min-height:calc(100vh - 74px);padding:28px 30px 44px}
.resources-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:10px 0 28px}
.resources-heading{max-width:980px}
.resources-heading h1{margin:0;color:var(--navy);font-size:32px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.resources-heading p{margin:14px 0 0;color:var(--muted);font-size:16.5px;line-height:1.55;max-width:1080px}
.resources-back{display:inline-flex;align-items:center;gap:9px;border:1.5px solid var(--border);background:#fff;color:var(--navy);border-radius:8px;padding:11px 17px;font-size:14px;font-weight:600;box-shadow:none;white-space:nowrap}
.resources-back:hover{background:var(--blue2)}
.resources-back svg{width:20px;height:20px;stroke:#8B9184}
.resources-grid{display:grid;grid-template-columns:minmax(0,760px);gap:18px}
.resource-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px 30px 30px;box-shadow:none}
.resource-card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.resource-icon-box{width:58px;height:58px;border-radius:10px;background:var(--blue2);border:1px solid var(--border);display:grid;place-items:center;box-shadow:none}
.resource-icon-box svg{width:34px;height:34px;stroke:var(--blue);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.resource-badge{display:inline-flex;align-items:center;background:var(--amber-tint);color:#7A5A14;border-radius:7px;padding:7px 11px;font-size:12.5px;font-weight:700}
.resource-card h2{margin:0;color:var(--navy);font-size:25px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.resource-card p{margin:14px 0 24px;color:var(--muted);font-size:15.5px;line-height:1.6;max-width:650px}
.resource-folder-name{font-weight:700;color:var(--text)}
.resource-open{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:8px;padding:13px 18px;background:var(--navy);color:#fff;font-size:15px;font-weight:600;cursor:pointer;box-shadow:none}
.resource-open:hover{background:#0E241F}
.resource-open svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.resources-page .footer{max-width:none;margin-top:38px}

.handbook-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.development-modules{align-items:stretch}.development-modules .program{height:100%;display:flex;flex-direction:column;align-items:flex-start}.development-modules .program>div:first-child{flex:1}.development-modules .program>.btn{margin-top:20px}.handbook-card{display:flex;flex-direction:column;align-items:flex-start}.handbook-card h3{color:var(--navy);margin:8px 0}.handbook-card p{color:var(--muted);line-height:1.55;flex:1}.handbook-card .btn{margin-top:auto}.handbook-source-note{color:#78889b;font-size:13px}.handbook-content{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px 34px;box-shadow:none;line-height:1.65;overflow-wrap:anywhere}.handbook-content h2,.handbook-content h3,.handbook-content h4,.handbook-content h5{color:var(--navy);line-height:1.3;margin:1.5em 0 .55em}.handbook-content h2:first-child{margin-top:0}.handbook-content p{margin:.55em 0;color:var(--text)}.handbook-content ul{padding-left:1.5em;color:var(--text)}.handbook-content li{margin:.3em 0}.handbook-content code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f0f4f8;border-radius:4px;padding:1px 4px;font-size:.92em;overflow-wrap:anywhere}.handbook-content pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#F1F5FC;border:1px solid #dbe4ee;border-radius:10px;padding:14px 16px;line-height:1.5;color:#22344a;overflow-x:auto}.handbook-content pre code{background:transparent;padding:0}.handbook-table-wrap{overflow-x:auto;margin:16px 0}.handbook-table{width:100%;border-collapse:collapse;font-size:14px}.handbook-table th,.handbook-table td{border:1px solid var(--border);padding:9px 12px;text-align:left;vertical-align:top}.handbook-table th{background:var(--blue2);color:var(--navy)}.handbook-content blockquote{border-left:4px solid #8fb8e6;margin:12px 0;padding:5px 14px;color:#596b80;background:#f7faff}

function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function renderAnnexLink(item){return `<a class="annex-link" href="${escapeHtml(item[2])}" target="_blank" rel="noopener noreferrer"><span>${t(item[0])}</span><strong>${escapeHtml(item[1])}</strong><span aria-hidden="true">↗</span></a>`}
function findAnnexSkill(code){for(const group of annexSkillGroups){const item=group.items.find(x=>x.code===code);if(item)return item}return null}
function showAnnex(code){window.currentView=code?'annexSkill':'annex';window.annexSelection=code||null;navActive('navDeveloper');const selected=code?findAnnexSkill(code):null;if(code&&!selected)return showAnnex();const back=window.developerSelection?`<button class="btn" onclick="showDeveloperPath('${window.developerSelection}')">${t('annexBackDetail')}</button>`:`<button class="btn" onclick="showDeveloperPaths()">${t('annexBack')}</button>`;let body='';if(selected){body=`<section class="card annex-detail"><div class="annex-code">${selected.code}</div><h2>${escapeHtml(selected.name)}</h2><p>${escapeHtml(lang==='lo'?selected.descLo:selected.desc)}</p><h3>${t('annexLinks')}</h3>${selected.links.length?selected.links.map(renderAnnexLink).join(''):`<p>${t('annexNoResources')}</p>`}</section>`}else{body=annexSkillGroups.map(group=>`<section class="annex-group"><h2>${t(group.title)}</h2><div class="annex-grid">${group.items.map(item=>`<article class="card annex-card"><button class="annex-code" onclick="showAnnex('${item.code}')">${item.code}</button><h3>${escapeHtml(item.name)}</h3><p>${escapeHtml(lang==='lo'?item.descLo:item.desc)}</p><button class="btn primary" onclick="showAnnex('${item.code}')">${t('annexLinks')}</button></article>`).join('')}</div></section>`).join('')+`<section class="annex-group"><h2>${t('annexSupporting')}</h2><p class="annex-intro">${t('annexSupportingIntro')}</p><div class="annex-grid">${annexDocuments.map(doc=>`<article class="card annex-card"><div class="status">${t(doc.group==='materials'?'annexDrive':'annexDoc')}</div><h3>${escapeHtml(doc.name)}</h3>${renderAnnexLink(['annexOpen',doc.name,doc.url])}</article>`).join('')}</div></section>`}document.getElementById('app').innerHTML=`<div class="page"><div class="breadcrumb">${t('home')} / <a href="#" onclick="showDevelopments();return false">${t('developmentsTitle')}</a> / <a href="#" onclick="showDeveloperPaths();return false">${t('developerLearning')}</a> / ${t('annexTitle')}</div><div class="subhead"><div><h1>${t('annexTitle')}</h1><p>${selected?t('annexCodeHint'):t('annexIntro')}</p></div>${back}</div>${body}<div class="footer"><span>${t('pilotFooter')}</span><span>${t('footerTag')}</span></div></div>`}
const handbookDocuments={"readme": "\u003ch2\u003eiCapture Developer Handbook\u003c/h2\u003e\u003cp\u003eWelcome to the iCapture Developer Handbook. This documentation provides comprehensive guidance for developers contributing to the iCapture application—a React + JavaScript application for DHIS2 data capture and integration.\u003c/p\u003e\u003ch3\u003eDocumentation Structure\u003c/h3\u003e\u003cp\u003eThis handbook is organized into the following documents:\u003c/p\u003e\u003ch4\u003e📖 Core Documentation\u003c/h4\u003e\u003cdiv class=\"handbook-table-wrap\"\u003e\u003ctable class=\"handbook-table\"\u003e\u003ctr\u003e\u003cth\u003e\u003cp\u003eDocument\u003c/p\u003e\u003c/th\u003e\u003cth\u003e\u003cp\u003ePurpose\u003c/p\u003e\u003c/th\u003e\u003cth\u003e\u003cp\u003eTarget Audience\u003c/p\u003e\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eSetup instructions and initial configuration\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eNew developers, onboarding\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eSystem design, tech stack, and patterns\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eAll developers, architects\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eGit workflow\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eAll developers\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eCode style, naming conventions, best practices\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eAll developers\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eReusable components and UI patterns\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eFrontend developers\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eTracker program development guide\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eFeature developers\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch3\u003eQuick Navigation\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNew to iCapture? → Start with\u003c/li\u003e\u003cli\u003eNeed to understand the system? → Read\u003c/li\u003e\u003cli\u003eReady to contribute? → Follow\u003c/li\u003e\u003cli\u003eWriting code? → Reference\u003c/li\u003e\u003cli\u003eBuilding UI? → Check\u003c/li\u003e\u003cli\u003eImplementing tracker programs? → See\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eTech Stack\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eFrontend: React 18+ with JavaScript\u003c/li\u003e\u003cli\u003eUI Library: Shadcn UI\u003c/li\u003e\u003cli\u003eState Management: Zustand\u003c/li\u003e\u003cli\u003eBackend Integration: DHIS2 APIs\u003c/li\u003e\u003cli\u003eBuild Tool: Vite/Webpack\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eKey Principles\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eConsistency - Standardize development practices across the team\u003c/li\u003e\u003cli\u003eReusability - Leverage existing components and patterns\u003c/li\u003e\u003cli\u003eScalability - Design for growth and maintainability\u003c/li\u003e\u003cli\u003eDocumentation - Keep docs up-to-date with code\u003c/li\u003e\u003cli\u003eCollaboration - Enable partner developers to contribute effectively\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eContributing to This Handbook\u003c/h3\u003e\u003cp\u003eIf you find gaps in the documentation or have suggestions for improvement:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eCreate an issue describing the needed documentation\u003c/li\u003e\u003cli\u003eSubmit a pull request with updates\u003c/li\u003e\u003cli\u003eEnsure all examples are verified and accurate\u003c/li\u003e\u003cli\u003eFollow Markdown conventions for consistency\u003c/li\u003e\u003c/ul\u003e", "gettingStarted": "\u003ch3\u003e01 - Getting Started\u003c/h3\u003e\u003ch3\u003ePurpose\u003c/h3\u003e\u003cp\u003eProvide a fast and reliable onboarding path so new contributors can run iCapture locally and start contributing with the same setup standards.\u003c/p\u003e\u003ch3\u003eTarget\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNew developers joining the project\u003c/li\u003e\u003cli\u003eExternal partner developers onboarding to iCapture\u003c/li\u003e\u003cli\u003eQA engineers needing a local test environment\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eSections\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003ePrerequisites\u003c/li\u003e\u003cli\u003eRepository Setup\u003c/li\u003e\u003cli\u003eEnvironment Configuration\u003c/li\u003e\u003cli\u003eRunning the Application\u003c/li\u003e\u003cli\u003eProject Scripts\u003c/li\u003e\u003cli\u003eFirst-Day Verification Checklist\u003c/li\u003e\u003cli\u003eCommon Onboarding Issues\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e1. Prerequisites\u003c/h3\u003e\u003cp\u003eMake sure you have the following installed:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNode.js (LTS version recommended)\u003c/li\u003e\u003cli\u003eYarn (project package manager)\u003c/li\u003e\u003cli\u003eGit\u003c/li\u003e\u003cli\u003eAccess to a DHIS2 environment\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eOptional but recommended:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eVS Code extensions: ESLint, Prettier, GitLens\u003c/li\u003e\u003cli\u003ePostman or an API client for API checks\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e2. Repository Setup\u003c/h3\u003e\u003cpre\u003e\u003ccode\u003egit clone \u0026lt;repository-url\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003ecd icapture-v3-laohis\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eyarn install\u003c/code\u003e\u003c/pre\u003e\u003ch3\u003e3. Environment Configuration\u003c/h3\u003e\u003cp\u003eCopy sample environment variables and update values:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003ecp .env.sample .env\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eTypical variables:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003e\u003ccode\u003eVITE_BASE_URL\u003c/code\u003e: DHIS2 server base URL\u003c/li\u003e\u003cli\u003e\u003ccode\u003eVITE_USERNAME\u003c/code\u003e: optional (for local basic auth)\u003c/li\u003e\u003cli\u003e\u003ccode\u003eVITE_PASSWORD\u003c/code\u003e: optional (for local basic auth)\u003c/li\u003e\u003cli\u003e\u003ccode\u003eVITE_DEBUG\u003c/code\u003e: enable debug behavior\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eSecurity notes:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNever commit real credentials.\u003c/li\u003e\u003cli\u003eKeep environment-specific values outside source control.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e4. Running the Application\u003c/h3\u003e\u003cp\u003eStart development server:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eyarn start\u003c/code\u003e\u003c/pre\u003e\u003ch3\u003e5. Project Scripts\u003c/h3\u003e\u003cp\u003eUse these as the standard workflow:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003e\u003ccode\u003eyarn start\u003c/code\u003e: run local dev server\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e6. First-Day Verification Checklist\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eInstall dependencies without errors\u003c/li\u003e\u003cli\u003eApp loads in browser\u003c/li\u003e\u003cli\u003eCore routes are accessible\u003c/li\u003e\u003cli\u003eMetadata loads successfully from DHIS2\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e7. Common Onboarding Issues\u003c/h3\u003e\u003ch4\u003eApp does not start\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eCheck Node.js version compatibility\u003c/li\u003e\u003cli\u003eRemove lockfile and reinstall dependencies if needed\u003c/li\u003e\u003cli\u003eVerify \u003ccode\u003e.env\u003c/code\u003e exists and has valid base URL\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eAuthentication loops to login page\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eVerify DHIS2 credentials/session\u003c/li\u003e\u003cli\u003eConfirm \u003ccode\u003eVITE_BASE_URL\u003c/code\u003e points to the correct DHIS2 instance\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eAPI/network failures\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eCheck VPN or network restrictions\u003c/li\u003e\u003cli\u003eVerify CORS and server availability\u003c/li\u003e\u003cli\u003eConfirm endpoint paths used by the app are enabled\u003c/li\u003e\u003c/ul\u003e", "architecture": "\u003ch3\u003e02 - Architecture Overview\u003c/h3\u003e\u003ch3\u003ePurpose\u003c/h3\u003e\u003cp\u003eDescribe iCapture architecture, core module boundaries, and integration patterns to help contributors make consistent design decisions and avoid duplicated implementations.\u003c/p\u003e\u003ch3\u003eTarget\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eAll developers\u003c/li\u003e\u003cli\u003eArchitects and technical leads\u003c/li\u003e\u003cli\u003eExternal partner teams implementing new modules\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eSections\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eSystem Context\u003c/li\u003e\u003cli\u003eApplication Layers\u003c/li\u003e\u003cli\u003eState Management Architecture\u003c/li\u003e\u003cli\u003eRouting and Feature Modules\u003c/li\u003e\u003cli\u003eIntegration with DHIS2\u003c/li\u003e\u003cli\u003eExtension and Customization Points\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e1. System Context\u003c/h3\u003e\u003cp\u003eiCapture is a React + JavaScript web application used for DHIS2 data capture workflows.\u003c/p\u003e\u003cp\u003eCore goals:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eReliable metadata-driven forms\u003c/li\u003e\u003cli\u003eReusable feature patterns\u003c/li\u003e\u003cli\u003eExtensible program and dataset customization\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e2. Application Layers\u003c/h3\u003e\u003ch4\u003ePresentation Layer\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eReact components and pages\u003c/li\u003e\u003cli\u003eShadcn UI-based component patterns\u003c/li\u003e\u003cli\u003eFeature-level containers for orchestration\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eApplication Layer\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eFeature hooks and orchestration logic\u003c/li\u003e\u003cli\u003eForm validation and data transformations\u003c/li\u003e\u003cli\u003eRoute-driven mode switching (tracker/event/aggregate)\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eData Layer\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eAPI clients and request wrappers\u003c/li\u003e\u003cli\u003eMetadata and runtime stores (Zustand)\u003c/li\u003e\u003cli\u003eDHIS2 endpoint integration\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e3. State Management Architecture\u003c/h3\u003e\u003cp\u003eZustand is used for centralized state slices.\u003c/p\u003e\u003cp\u003eRecommended state boundaries:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eGlobal app state (dialogs, global notifications)\u003c/li\u003e\u003cli\u003eMetadata state (programs, datasets, org units, option sets)\u003c/li\u003e\u003cli\u003eUser selection state (program, dataset, org unit, period)\u003c/li\u003e\u003cli\u003eFeature state (event/tracker/aggregate screens)\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eGuidelines:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eKeep stores focused by domain\u003c/li\u003e\u003cli\u003ePrefer selectors to avoid unnecessary rerenders\u003c/li\u003e\u003cli\u003eKeep side effects in hooks/services, not store declarations\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e4. Routing and Feature Modules\u003c/h3\u003e\u003cp\u003eTypical feature areas:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eTracker workflows\u003c/li\u003e\u003cli\u003eEvent workflows\u003c/li\u003e\u003cli\u003eAggregate dataset workflows\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eRouting principles:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eURL should reflect current working context\u003c/li\u003e\u003cli\u003eSelection state and route should remain synchronized\u003c/li\u003e\u003cli\u003eFeature modules own their internal UI and logic\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e5. Integration with DHIS2\u003c/h3\u003e\u003cp\u003eIntegration model:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eShared API client wrappers for GET/POST/DELETE\u003c/li\u003e\u003cli\u003eConsistent error handling and retry strategy\u003c/li\u003e\u003cli\u003eMetadata preloading at app initialization\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eData flow pattern:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eFetch metadata and user context\u003c/li\u003e\u003cli\u003eStore in centralized metadata state\u003c/li\u003e\u003cli\u003eBind selected configuration to forms/pages\u003c/li\u003e\u003cli\u003eSubmit transformed payloads to DHIS2 tracker/data value APIs\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e6. Extension and Customization Points\u003c/h3\u003e\u003cp\u003eUse extension points to avoid forking core flows:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eProgram-specific forms\u003c/li\u003e\u003cli\u003eDataset-specific forms\u003c/li\u003e\u003cli\u003eControl-bar behavior toggles\u003c/li\u003e\u003cli\u003eProgram-stage rules and custom handlers\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eRules for extension design:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eKeep extension registration declarative\u003c/li\u003e\u003cli\u003eAvoid direct mutations of core runtime assumptions\u003c/li\u003e\u003cli\u003eDocument each extension in the relevant module guide\u003c/li\u003e\u003c/ul\u003e", "workflow": "\u003ch3\u003e03 - Development Workflow\u003c/h3\u003e\u003ch3\u003ePurpose\u003c/h3\u003e\u003cp\u003eDefine the required code contribution process for this project.\u003c/p\u003e\u003cp\u003eThis document reflects the actual team workflow and must be followed exactly.\u003c/p\u003e\u003ch3\u003eCode Contribution Workflow\u003c/h3\u003e\u003cp\u003eIf a developer wants to commit code changes, use the following sequence.\u003c/p\u003e\u003ch4\u003e1) Stage all changes\u003c/h4\u003e\u003cp\u003eRun:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003egit add .\u003c/code\u003e\u003c/pre\u003e\u003ch4\u003e2) Create commit with interactive prompt\u003c/h4\u003e\u003cp\u003eRun:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eyarn commit\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eThen complete the prompts using these rules.\u003c/p\u003e\u003ch4\u003e3) Commit Type\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse \u003ccode\u003efix\u003c/code\u003e by default.\u003c/li\u003e\u003cli\u003eIf unsure, contact HISPVN-MK.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e4) Commit Scope\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eLeave blank.\u003c/li\u003e\u003cli\u003ePress Enter.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e5) Short Description\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eProvide a brief description of the change.\u003c/li\u003e\u003cli\u003eMaximum 95 characters.\u003c/li\u003e\u003cli\u003eExample:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003ewrong translation in EIR immunization form\u003c/code\u003e\u003c/pre\u003e\u003ch4\u003e6) Long Description\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eLeave blank.\u003c/li\u003e\u003cli\u003ePress Enter.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e7) Breaking Changes\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eAnswer \u003ccode\u003eNo\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e8) Open Issues\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eAnswer \u003ccode\u003eNo\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e9) Push changes\u003c/h4\u003e\u003cp\u003eRun:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003egit push\u003c/code\u003e\u003c/pre\u003e\u003ch4\u003e10) Pull Request action\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eDo not create a Pull Request yourself.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eDeveloper Responsibilities\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eFollow the commit prompt instructions in this document without deviation.\u003c/li\u003e\u003cli\u003eKeep the short description clear, specific, and under 95 characters.\u003c/li\u003e\u003cli\u003eAsk HISPVN-MK when commit type is unclear.\u003c/li\u003e\u003cli\u003ePush committed changes after completing the prompt flow.\u003c/li\u003e\u003cli\u003eAfter pushing, notify HISPVN-MK in the Collaborative Development channel.\u003c/li\u003e\u003cli\u003eInclude a concise summary of what was changed when notifying HISPVN-MK.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eReview and Merge Process\u003c/h3\u003e\u003cp\u003eAfter code is pushed:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eDeveloper notifies HISPVN-MK in the Collaborative Development channel.\u003c/li\u003e\u003cli\u003eNotification includes a summary of implemented changes.\u003c/li\u003e\u003cli\u003eHISPVN-MK reviews the pushed changes.\u003c/li\u003e\u003cli\u003eHISPVN-MK creates the Pull Request.\u003c/li\u003e\u003cli\u003eHISPVN-MK merges the Pull Request after review is complete.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThis repository uses a maintainer-managed review and merge model.\u003c/p\u003e", "codingStandards": "\u003ch2\u003e04 - Coding Standards\u003c/h2\u003e\u003ch3\u003ePurpose\u003c/h3\u003e\u003cp\u003eDefine enforceable coding standards for iCapture so internal and partner teams can ship consistent, maintainable, and reusable code.\u003c/p\u003e\u003ch3\u003eTarget\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eFrontend developers\u003c/li\u003e\u003cli\u003eTechnical leads and reviewers\u003c/li\u003e\u003cli\u003eExternal partner developers\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eScope\u003c/h3\u003e\u003cp\u003eThis document applies to all frontend code using:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eReact\u003c/li\u003e\u003cli\u003eJavaScript\u003c/li\u003e\u003cli\u003eShadcn UI\u003c/li\u003e\u003cli\u003eZustand\u003c/li\u003e\u003cli\u003eDHIS2 APIs\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e1. Naming Conventions\u003c/h3\u003e\u003ch4\u003e1.1 Components\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse \u003ccode\u003ePascalCase\u003c/code\u003e for component names and files.\u003c/li\u003e\u003cli\u003eComponent file names should match exported component name.\u003c/li\u003e\u003cli\u003eUse descriptive names tied to business intent, not visual implementation only.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExamples:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eProgramSummaryCard.jsx\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eDatasetEntryForm.jsx\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eOne primary component per file.\u003c/li\u003e\u003cli\u003ePrefer named exports for shared components; default export is allowed for route-level components.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e1.2 Hooks\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse \u003ccode\u003euse\u003c/code\u003e prefix and \u003ccode\u003ecamelCase\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eHook names must describe behavior, not UI location.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExamples:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003euseProgramMetadata\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003euseDatasetSubmission\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eHooks must be side-effect aware and return stable contracts.\u003c/li\u003e\u003cli\u003eDo not hide critical side effects in ambiguous names.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e1.3 Services\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse domain-focused \u003ccode\u003ecamelCase\u003c/code\u003e names with \u003ccode\u003eService\u003c/code\u003e suffix.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExamples:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eprogramService.js\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003etrackerService.js\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eServices own API interaction and mapping logic.\u003c/li\u003e\u003cli\u003eServices should not render UI or access browser-only UI state.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e1.4 Stores\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eZustand store files must use \u003ccode\u003e\u0026lt;domain\u0026gt;Store.js\u003c/code\u003e naming.\u003c/li\u003e\u003cli\u003eHook accessors should use \u003ccode\u003euse\u0026lt;Domain\u0026gt;Store\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExamples:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003emetadataStore.js\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003euseMetadataStore\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eKeep one bounded context per store.\u003c/li\u003e\u003cli\u003eStore action names must be verbs: \u003ccode\u003esetProgram\u003c/code\u003e, \u003ccode\u003eresetSelection\u003c/code\u003e, \u003ccode\u003etoggleDialog\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e1.5 Types\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eType aliases and interfaces use \u003ccode\u003ePascalCase\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eUse suffixes when it improves clarity.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExamples:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eProgramMetadata\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eDatasetSubmissionPayload\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eTrackerStoreState\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eAPI models: \u003ccode\u003e*Response\u003c/code\u003e, \u003ccode\u003e*Request\u003c/code\u003e, \u003ccode\u003e*Payload\u003c/code\u003e\u003c/li\u003e\u003cli\u003eUI models: \u003ccode\u003e*ViewModel\u003c/code\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e1.6 Constants\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse \u003ccode\u003eUPPER_SNAKE_CASE\u003c/code\u003e for compile-time constants.\u003c/li\u003e\u003cli\u003eGroup constants by domain in dedicated files.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExamples:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eDEFAULT_PAGE_SIZE\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eDHIS2_API_VERSION\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003ePROGRAM_STATUS\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eDo not inline repeated literals across modules.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e2. File Organization Standards\u003c/h3\u003e\u003cp\u003eUse feature-first organization for business modules and shared folders for cross-cutting code.\u003c/p\u003e\u003cp\u003eRecommended shape:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003esrc/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003efeatures/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003etracker/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003ecomponents/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003ehooks/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eservices/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003etypes/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eindex.js\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003ecomponents/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003ecommon/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eui/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003estores/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eservices/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eapis/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eutils/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003etypes/\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eKeep feature logic inside feature folders.\u003c/li\u003e\u003cli\u003eMove only genuinely reusable code to shared folders.\u003c/li\u003e\u003cli\u003eAvoid circular imports between features and shared modules.\u003c/li\u003e\u003cli\u003eKeep barrel files small and intentional.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eFile splitting guidance:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eIf a file exceeds approximately 300 lines with mixed concerns, split by responsibility.\u003c/li\u003e\u003cli\u003eSeparate component rendering, business logic, and data access.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e3. Function Documentation Standards\u003c/h3\u003e\u003cp\u003eEvery exported function must include a documentation block with:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003ePurpose\u003c/li\u003e\u003cli\u003eParameters\u003c/li\u003e\u003cli\u003eReturn value\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eTemplate:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e/**\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Purpose:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* \u0026lt;what the function does and why\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Parameters:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* - \u0026lt;name\u0026gt;: \u0026lt;description\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Return:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* \u0026lt;what is returned\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*/\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRequired for:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eExported utility functions\u003c/li\u003e\u003cli\u003eService/API functions\u003c/li\u003e\u003cli\u003eCustom hooks\u003c/li\u003e\u003cli\u003eNon-trivial store actions\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eOptional for:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eSmall private helpers where intent is obvious\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExample:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e/**\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Purpose:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Fetch program metadata from DHIS2 and map it to UI-safe shape.\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Parameters:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* - programId: DHIS2 program identifier.\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Return:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Program metadata object used by iCapture forms.\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eexport async function getProgramMetadata(programId: string): Promise\u0026lt;ProgramMetadata\u0026gt; {\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e// implementation\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e}\u003c/code\u003e\u003c/pre\u003e\u003ch3\u003e4. Component Documentation Standards\u003c/h3\u003e\u003cp\u003eEvery reusable component must include a top-level documentation block.\u003c/p\u003e\u003cp\u003eTemplate:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e/**\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Purpose:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* \u0026lt;component responsibility\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Props:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* - \u0026lt;propName\u0026gt;: \u0026lt;description\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Behavior:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* \u0026lt;important rendering, state, and side-effect notes\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*/\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eComponent rules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eDefine explicit prop types.\u003c/li\u003e\u003cli\u003eKeep components focused on one clear responsibility.\u003c/li\u003e\u003cli\u003eMove heavy logic to hooks/services.\u003c/li\u003e\u003cli\u003eAdd accessibility requirements for interactive controls.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eShadcn UI specific:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003ePrefer shared design tokens over hardcoded colors and spacing.\u003c/li\u003e\u003cli\u003eCompose UI from shared primitives in \u003ccode\u003ecomponents/ui\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eWrap repeated Shadcn composition patterns into shared reusable components.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e5. State Management Standards (Zustand)\u003c/h3\u003e\u003ch4\u003e5.1 Store Design\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eOne store per domain boundary.\u003c/li\u003e\u003cli\u003eDefine \u003ccode\u003estate\u003c/code\u003e, \u003ccode\u003eactions\u003c/code\u003e, and \u003ccode\u003ereset\u003c/code\u003e behavior clearly.\u003c/li\u003e\u003cli\u003eKeep store initialization deterministic.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e5.2 Selectors\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse selectors to subscribe only to required slices.\u003c/li\u003e\u003cli\u003eAvoid selecting whole store objects in large components.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e5.3 Actions\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eActions must be predictable and side-effect minimal.\u003c/li\u003e\u003cli\u003eName actions with intention-revealing verbs.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e5.4 Side Effects\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eAPI calls should live in services/hooks, not inside store definition blocks.\u003c/li\u003e\u003cli\u003eStore actions can coordinate data updates after service calls complete.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e5.5 Store Documentation\u003c/h4\u003e\u003cp\u003eDocument each store with:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eDomain ownership\u003c/li\u003e\u003cli\u003eState fields\u003c/li\u003e\u003cli\u003eAction responsibilities\u003c/li\u003e\u003cli\u003eReset semantics\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e6. API Integration Standards (DHIS2)\u003c/h3\u003e\u003ch4\u003e6.1 API Layering\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse shared HTTP wrappers for transport behavior.\u003c/li\u003e\u003cli\u003eKeep endpoint definitions in domain API modules.\u003c/li\u003e\u003cli\u003eKeep data mapping in converter functions.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e6.2 Naming\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse \u003ccode\u003egetX\u003c/code\u003e, \u003ccode\u003esearchX\u003c/code\u003e, \u003ccode\u003esaveX\u003c/code\u003e, \u003ccode\u003edeleteX\u003c/code\u003e patterns.\u003c/li\u003e\u003cli\u003eSuffix payload contracts with \u003ccode\u003eRequest\u003c/code\u003e or \u003ccode\u003ePayload\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e6.3 Request Rules\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eValidate required identifiers before calling API.\u003c/li\u003e\u003cli\u003eEncode query parameters safely.\u003c/li\u003e\u003cli\u003eDo not build complex query strings in UI components.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e6.4 Response Rules\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNormalize API responses before storing in Zustand.\u003c/li\u003e\u003cli\u003eAvoid passing raw DHIS2 payloads through multiple UI layers when a mapped model exists.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e6.5 API Documentation\u003c/h4\u003e\u003cp\u003eEvery exported API function must include Purpose, Parameters, and Return documentation.\u003c/p\u003e\u003ch3\u003e7. Error Handling Standards\u003c/h3\u003e\u003ch4\u003e7.1 Error Categories\u003c/h4\u003e\u003cp\u003eHandle errors by category:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNetwork/transport errors\u003c/li\u003e\u003cli\u003eAuthentication/authorization errors\u003c/li\u003e\u003cli\u003eValidation/business rule errors\u003c/li\u003e\u003cli\u003eUnexpected runtime errors\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e7.2 User Messaging\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eProvide actionable and non-technical messages in UI.\u003c/li\u003e\u003cli\u003eKeep technical details in logs, not end-user dialogs.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e7.3 Logging\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eLog enough context for debugging: endpoint, identifiers, action.\u003c/li\u003e\u003cli\u003eNever log secrets or credentials.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e7.4 Recovery Strategy\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eDefine retry behavior for transient failures.\u003c/li\u003e\u003cli\u003eProvide fallback UI states (loading, empty, error).\u003c/li\u003e\u003cli\u003eAvoid silent failures.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e7.5 Error Object Shape\u003c/h4\u003e\u003cp\u003eStandardize error objects for consistency across features.\u003c/p\u003e\u003cp\u003eSuggested fields:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003ecode\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003emessage\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003econtext\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003erecoverable\u003c/code\u003e\u003c/pre\u003e\u003ch3\u003e8. Before push code Checklist\u003c/h3\u003e\u003cp\u003eAll code before push must satisfy the following:\u003c/p\u003e\u003ch4\u003eCode Quality\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNaming conventions follow this standard\u003c/li\u003e\u003cli\u003eFile placement follows feature/shared boundaries\u003c/li\u003e\u003cli\u003eFunction and component docs added for new exports\u003c/li\u003e\u003cli\u003eNo duplicate logic introduced\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eBehavior and Safety\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eState updates are predictable and manually verified\u003c/li\u003e\u003cli\u003eAPI calls use service/API layers only\u003c/li\u003e\u003cli\u003eError handling is implemented for failure paths\u003c/li\u003e\u003cli\u003eLoading/empty/error UI states are handled\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eDocumentation\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRelevant docs updated (including this file when standards changed)\u003c/li\u003e\u003cli\u003eScreenshots or videos included for UI changes\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e9. Code Review Checklist\u003c/h3\u003e\u003cp\u003eReviewers must validate:\u003c/p\u003e\u003ch4\u003eArchitecture\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eChange aligns with module boundaries\u003c/li\u003e\u003cli\u003eReuse preferred over new abstractions\u003c/li\u003e\u003cli\u003eNo hidden coupling introduced\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eReadability and Maintainability\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNames are clear and intention-revealing\u003c/li\u003e\u003cli\u003eComplex logic extracted into hooks/services/utilities\u003c/li\u003e\u003cli\u003ePublic functions/components are documented\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eState and Data Flow\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eZustand selectors are scoped correctly\u003c/li\u003e\u003cli\u003eStore actions remain deterministic\u003c/li\u003e\u003cli\u003eAPI mapping is explicit and type-safe\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eResilience\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eError cases handled correctly\u003c/li\u003e\u003cli\u003eUser-facing messages are useful\u003c/li\u003e\u003cli\u003eNo sensitive data exposure in logs\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eDelivery Quality\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eManual verification checklist is appropriate to risk\u003c/li\u003e\u003cli\u003eDocumentation impact is addressed\u003c/li\u003e\u003c/ul\u003e", "componentCatalog": "\u003ch2\u003e05 - Component Catalog\u003c/h2\u003e\u003ch3\u003ePurpose\u003c/h3\u003e\u003cp\u003eProvide a complete catalog of reusable components under \u003ccode\u003esrc/components\u003c/code\u003e to standardize implementation and prevent duplicate UI/feature primitives.\u003c/p\u003e\u003ch3\u003eTarget\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eFrontend developers\u003c/li\u003e\u003cli\u003eExternal partner contributors\u003c/li\u003e\u003cli\u003eReviewers validating reuse and consistency\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eScope\u003c/h3\u003e\u003cp\u003eThis catalog is generated from all files under:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003esrc/components/ui\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003esrc/components/dhis2\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003esrc/components/layout\u003c/code\u003e\u003c/pre\u003e\u003ch3\u003eClassification Rules\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eShared Components: reusable across multiple features or domains.\u003c/li\u003e\u003cli\u003eFeature Components: tightly coupled to tracker/event/aggregate workflows and should remain feature-bound.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eShared Components\u003c/h3\u003e\u003ch4\u003e1) Button Family\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eButton\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/ui/button.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: Generic action button with variants and sizes.\u003c/li\u003e\u003cli\u003eMain props: \u003ccode\u003evariant\u003c/code\u003e, \u003ccode\u003esize\u003c/code\u003e, \u003ccode\u003eclassName\u003c/code\u003e, \u003ccode\u003easChild\u003c/code\u003e, native button props (\u003ccode\u003eonClick\u003c/code\u003e, \u003ccode\u003edisabled\u003c/code\u003e, \u003ccode\u003etype\u003c/code\u003e).\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;Button variant=\"success\" size=\"lg\" onClick={handleSubmit}\u0026gt;Save\u0026lt;/Button\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: all primary/secondary actions.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: \u003ccode\u003eLoadingButton\u003c/code\u003e, pagination controls.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e2) LoadingButton\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eLoadingButton\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/ui/loadingbutton.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: Button with built-in loading state and spinner.\u003c/li\u003e\u003cli\u003eMain props: \u003ccode\u003eloading\u003c/code\u003e, all \u003ccode\u003eButton\u003c/code\u003e props.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;LoadingButton loading={isSaving} onClick={onSave}\u0026gt;Save\u0026lt;/LoadingButton\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: async save/delete/submit actions.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: \u003ccode\u003eButton\u003c/code\u003e + custom spinner wrappers.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e3) Input\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eInput\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/ui/input.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: Single-line text-like input wrapper.\u003c/li\u003e\u003cli\u003eMain props: \u003ccode\u003etype\u003c/code\u003e, \u003ccode\u003evalue\u003c/code\u003e, \u003ccode\u003eonChange\u003c/code\u003e, \u003ccode\u003eplaceholder\u003c/code\u003e, \u003ccode\u003edisabled\u003c/code\u003e, \u003ccode\u003eclassName\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;Input value={name} onChange={(e) =\u0026gt; setName(e.target.value)} placeholder=\"Name\" /\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: text, number, email, password input.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: \u003ccode\u003eTextarea\u003c/code\u003e, \u003ccode\u003eDatePicker\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e4) Textarea\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eTextarea\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/ui/textarea.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: Multi-line text input.\u003c/li\u003e\u003cli\u003eMain props: \u003ccode\u003evalue\u003c/code\u003e, \u003ccode\u003eonChange\u003c/code\u003e, \u003ccode\u003eplaceholder\u003c/code\u003e, \u003ccode\u003edisabled\u003c/code\u003e, \u003ccode\u003eclassName\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;Textarea value={notes} onChange={(e) =\u0026gt; setNotes(e.target.value)} /\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: comments, descriptions, notes.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: \u003ccode\u003eInput\u003c/code\u003e with manual row hacks.\u003c/li\ \u003e\u003c/li\u003e\u003cli\u003ePurpose: Searchable grouped multi-select.\u003c/li\u003e\u003cli\u003eMain props: \u003ccode\u003eoptions\u003c/code\u003e, \u003ccode\u003egroups\u003c/code\u003e, \u003ccode\u003evalue\u003c/code\u003e (array), \u003ccode\u003eonChange\u003c/code\u003e, \u003ccode\u003eplaceholder\u003c/code\u003e, \u003ccode\u003esearchPlaceHolder\u003c/code\u003e, \u003ccode\u003elabel\u003c/code\u003e, \u003ccode\u003edisabled\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;MultiSelect options={tags} value={selectedTags} onChange={setSelectedTags} /\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: many-to-many filtering and category selection.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: checkboxes-in-dialog custom implementations.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e11) DatePicker\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eDatePicker\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/ui/datepicker.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: Single date input with parsing/formatting and calendar popover.\u003c/li\u003e\u003cli\u003eMain props: \u003ccode\u003evalue\u003c/code\u003e, \u003ccode\u003eonChange\u003c/code\u003e, \u003ccode\u003edateFormat\u003c/code\u003e, \u003ccode\u003edisabled\u003c/code\u003e, \u003ccode\u003eminDate\u003c/code\u003e, \u003ccode\u003emaxDate\u003c/code\u003e, \u003ccode\u003edefaultMonth\u003c/code\u003e, \u003ccode\u003eformatter\u003c/code\u003e, \u003ccode\u003eallowKeyboard\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;DatePicker value={occurredAt} onChange={setOccurredAt} dateFormat=\"yyyy-MM-dd\" /\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: event dates, DOB, period boundaries.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: plain text date parsing controls.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e12) DateRangePicker\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eDateRangePicker\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/ui/date-range-picker.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: From/to date range selector.\u003c/li\u003e\u003cli\u003eMain props: \u003ccode\u003evalue\u003c/code\u003e (\u003ccode\u003e{from,to}\u003c/code\u003e), \u003ccode\u003eonChange\u003c/code\u003e, \u003ccode\u003edateFormat\u003c/code\u003e, \u003ccode\u003edisabled\u003c/code\u003e, \u003ccode\u003eminDate\u003c/code\u003e, \u003ccode\u003emaxDate\u003c/code\u003e, \u003ccode\u003eallowKeyboard\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;DateRangePicker value={range} onChange={setRange} /\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: filtering by period ranges.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: two independent \u003ccode\u003eDatePicker\u003c/code\u003es without range coordination.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e13) AgePicker\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eAgePicker\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/ui/agepicker.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: Age-based input with conversion to date value.\u003c/li\u003e\u003cli\u003eMain props: \u003ccode\u003evalue\u003c/code\u003e, \u003ccode\u003eonChange\u003c/code\u003e, \u003ccode\u003erefDate\u003c
