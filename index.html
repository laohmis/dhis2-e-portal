const handbookDocuments={"readme": "\u003ch2\u003eiCapture Developer Handbook\u003c/h2\u003e\u003cp\u003eWelcome to the iCapture Developer Handbook. This documentation provides comprehensive guidance for developers contributing to the iCapture application—a React + JavaScript application for DHIS2 data capture and integration.\u003c/p\u003e\u003ch3\u003eDocumentation Structure\u003c/h3\u003e\u003cp\u003eThis handbook is organized into the following documents:\u003c/p\u003e\u003ch4\u003e📖 Core Documentation\u003c/h4\u003e\u003cdiv class=\"handbook-table-wrap\"\u003e\u003ctable class=\"handbook-table\"\u003e\u003ctr\u003e\u003cth\u003e\u003cp\u003eDocument\u003c/p\u003e\u003c/th\u003e\u003cth\u003e\u003cp\u003ePurpose\u003c/p\u003e\u003c/th\u003e\u003cth\u003e\u003cp\u003eTarget Audience\u003c/p\u003e\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eSetup instructions and initial configuration\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eNew developers, onboarding\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eSystem design, tech stack, and patterns\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eAll developers, architects\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eGit workflow\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eAll developers\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eCode style, naming conventions, best practices\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eAll developers\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eReusable components and UI patterns\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eFrontend developers\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eTracker program development guide\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003eFeature developers\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch3\u003eQuick Navigation\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNew to iCapture? → Start with\u003c/li\u003e\u003cli\u003eNeed to understand the system? → Read\u003c/li\u003e\u003cli\u003eReady to contribute? → Follow\u003c/li\u003e\u003cli\u003eWriting code? → Reference\u003c/li\u003e\u003cli\u003eBuilding UI? → Check\u003c/li\u003e\u003cli\u003eImplementing tracker programs? → See\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eTech Stack\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eFrontend: React 18+ with JavaScript\u003c/li\u003e\u003cli\u003eUI Library: Shadcn UI\u003c/li\u003e\u003cli\u003eState Management: Zustand\u003c/li\u003e\u003cli\u003eBackend Integration: DHIS2 APIs\u003c/li\u003e\u003cli\u003eBuild Tool: Vite/Webpack\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eKey Principles\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eConsistency - Standardize development practices across the team\u003c/li\u003e\u003cli\u003eReusability - Leverage existing components and patterns\u003c/li\u003e\u003cli\u003eScalability - Design for growth and maintainability\u003c/li\u003e\u003cli\u003eDocumentation - Keep docs up-to-date with code\u003c/li\u003e\u003cli\u003eCollaboration - Enable partner developers to contribute effectively\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eContributing to This Handbook\u003c/h3\u003e\u003cp\u003eIf you find gaps in the documentation or have suggestions for improvement:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eCreate an issue describing the needed documentation\u003c/li\u003e\u003cli\u003eSubmit a pull request with updates\u003c/li\u003e\u003cli\u003eEnsure all examples are verified and accurate\u003c/li\u003e\u003cli\u003eFollow Markdown conventions for consistency\u003c/li\u003e\u003c/ul\u003e", "gettingStarted": "\u003ch3\u003e01 - Getting Started\u003c/h3\u003e\u003ch3\u003ePurpose\u003c/h3\u003e\u003cp\u003eProvide a fast and reliable onboarding path so new contributors can run iCapture locally and start contributing with the same setup standards.\u003c/p\u003e\u003ch3\u003eTarget\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNew developers joining the project\u003c/li\u003e\u003cli\u003eExternal partner developers onboarding to iCapture\u003c/li\u003e\u003cli\u003eQA engineers needing a local test environment\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eSections\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003ePrerequisites\u003c/li\u003e\u003cli\u003eRepository Setup\u003c/li\u003e\u003cli\u003eEnvironment Configuration\u003c/li\u003e\u003cli\u003eRunning the Application\u003c/li\u003e\u003cli\u003eProject Scripts\u003c/li\u003e\u003cli\u003eFirst-Day Verification Checklist\u003c/li\u003e\u003cli\u003eCommon Onboarding Issues\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e1. Prerequisites\u003c/h3\u003e\u003cp\u003eMake sure you have the following installed:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNode.js (LTS version recommended)\u003c/li\u003e\u003cli\u003eYarn (project package manager)\u003c/li\u003e\u003cli\u003eGit\u003c/li\u003e\u003cli\u003eAccess to a DHIS2 environment\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eOptional but recommended:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eVS Code extensions: ESLint, Prettier, GitLens\u003c/li\u003e\u003cli\u003ePostman or an API client for API checks\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e2. Repository Setup\u003c/h3\u003e\u003cpre\u003e\u003ccode\u003egit clone \u0026lt;repository-url\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003ecd icapture-v3-laohis\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eyarn install\u003c/code\u003e\u003c/pre\u003e\u003ch3\u003e3. Environment Configuration\u003c/h3\u003e\u003cp\u003eCopy sample environment variables and update values:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003ecp .env.sample .env\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eTypical variables:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003e\u003ccode\u003eVITE_BASE_URL\u003c/code\u003e: DHIS2 server base URL\u003c/li\u003e\u003cli\u003e\u003ccode\u003eVITE_USERNAME\u003c/code\u003e: optional (for local basic auth)\u003c/li\u003e\u003cli\u003e\u003ccode\u003eVITE_PASSWORD\u003c/code\u003e: optional (for local basic auth)\u003c/li\u003e\u003cli\u003e\u003ccode\u003eVITE_DEBUG\u003c/code\u003e: enable debug behavior\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eSecurity notes:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNever commit real credentials.\u003c/li\u003e\u003cli\u003eKeep environment-specific values outside source control.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e4. Running the Application\u003c/h3\u003e\u003cp\u003eStart development server:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eyarn start\u003c/code\u003e\u003c/pre\u003e\u003ch3\u003e5. Project Scripts\u003c/h3\u003e\u003cp\u003eUse these as the standard workflow:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003e\u003ccode\u003eyarn start\u003c/code\u003e: run local dev server\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e6. First-Day Verification Checklist\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eInstall dependencies without errors\u003c/li\u003e\u003cli\u003eApp loads in browser\u003c/li\u003e\u003cli\u003eCore routes are accessible\u003c/li\u003e\u003cli\u003eMetadata loads successfully from DHIS2\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e7. Common Onboarding Issues\u003c/h3\u003e\u003ch4\u003eApp does not start\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eCheck Node.js version compatibility\u003c/li\u003e\u003cli\u003eRemove lockfile and reinstall dependencies if needed\u003c/li\u003e\u003cli\u003eVerify \u003ccode\u003e.env\u003c/code\u003e exists and has valid base URL\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eAuthentication loops to login page\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eVerify DHIS2 credentials/session\u003c/li\u003e\u003cli\u003eConfirm \u003ccode\u003eVITE_BASE_URL\u003c/code\u003e points to the correct DHIS2 instance\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eAPI/network failures\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eCheck VPN or network restrictions\u003c/li\u003e\u003cli\u003eVerify CORS and server availability\u003c/li\u003e\u003cli\u003eConfirm endpoint paths used by the app are enabled\u003c/li\u003e\u003c/ul\u003e", "architecture": "\u003ch3\u003e02 - Architecture Overview\u003c/h3\u003e\u003ch3\u003ePurpose\u003c/h3\u003e\u003cp\u003eDescribe iCapture architecture, core module boundaries, and integration patterns to help contributors make consistent design decisions and avoid duplicated implementations.\u003c/p\u003e\u003ch3\u003eTarget\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eAll developers\u003c/li\u003e\u003cli\u003eArchitects and technical leads\u003c/li\u003e\u003cli\u003eExternal partner teams implementing new modules\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eSections\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eSystem Context\u003c/li\u003e\u003cli\u003eApplication Layers\u003c/li\u003e\u003cli\u003eState Management Architecture\u003c/li\u003e\u003cli\u003eRouting and Feature Modules\u003c/li\u003e\u003cli\u003eIntegration with DHIS2\u003c/li\u003e\u003cli\u003eExtension and Customization Points\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e1. System Context\u003c/h3\u003e\u003cp\u003eiCapture is a React + JavaScript web application used for DHIS2 data capture workflows.\u003c/p\u003e\u003cp\u003eCore goals:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eReliable metadata-driven forms\u003c/li\u003e\u003cli\u003eReusable feature patterns\u003c/li\u003e\u003cli\u003eExtensible program and dataset customization\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e2. Application Layers\u003c/h3\u003e\u003ch4\u003ePresentation Layer\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eReact components and pages\u003c/li\u003e\u003cli\u003eShadcn UI-based component patterns\u003c/li\u003e\u003cli\u003eFeature-level containers for orchestration\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eApplication Layer\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eFeature hooks and orchestration logic\u003c/li\u003e\u003cli\u003eForm validation and data transformations\u003c/li\u003e\u003cli\u003eRoute-driven mode switching (tracker/event/aggregate)\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eData Layer\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eAPI clients and request wrappers\u003c/li\u003e\u003cli\u003eMetadata and runtime stores (Zustand)\u003c/li\u003e\u003cli\u003eDHIS2 endpoint integration\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e3. State Management Architecture\u003c/h3\u003e\u003cp\u003eZustand is used for centralized state slices.\u003c/p\u003e\u003cp\u003eRecommended state boundaries:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eGlobal app state (dialogs, global notifications)\u003c/li\u003e\u003cli\u003eMetadata state (programs, datasets, org units, option sets)\u003c/li\u003e\u003cli\u003eUser selection state (program, dataset, org unit, period)\u003c/li\u003e\u003cli\u003eFeature state (event/tracker/aggregate screens)\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eGuidelines:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eKeep stores focused by domain\u003c/li\u003e\u003cli\u003ePrefer selectors to avoid unnecessary rerenders\u003c/li\u003e\u003cli\u003eKeep side effects in hooks/services, not store declarations\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e4. Routing and Feature Modules\u003c/h3\u003e\u003cp\u003eTypical feature areas:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eTracker workflows\u003c/li\u003e\u003cli\u003eEvent workflows\u003c/li\u003e\u003cli\u003eAggregate dataset workflows\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eRouting principles:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eURL should reflect current working context\u003c/li\u003e\u003cli\u003eSelection state and route should remain synchronized\u003c/li\u003e\u003cli\u003eFeature modules own their internal UI and logic\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e5. Integration with DHIS2\u003c/h3\u003e\u003cp\u003eIntegration model:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eShared API client wrappers for GET/POST/DELETE\u003c/li\u003e\u003cli\u003eConsistent error handling and retry strategy\u003c/li\u003e\u003cli\u003eMetadata preloading at app initialization\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eData flow pattern:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eFetch metadata and user context\u003c/li\u003e\u003cli\u003eStore in centralized metadata state\u003c/li\u003e\u003cli\u003eBind selected configuration to forms/pages\u003c/li\u003e\u003cli\u003eSubmit transformed payloads to DHIS2 tracker/data value APIs\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e6. Extension and Customization Points\u003c/h3\u003e\u003cp\u003eUse extension points to avoid forking core flows:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eProgram-specific forms\u003c/li\u003e\u003cli\u003eDataset-specific forms\u003c/li\u003e\u003cli\u003eControl-bar behavior toggles\u003c/li\u003e\u003cli\u003eProgram-stage rules and custom handlers\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eRules for extension design:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eKeep extension registration declarative\u003c/li\u003e\u003cli\u003eAvoid direct mutations of core runtime assumptions\u003c/li\u003e\u003cli\u003eDocument each extension in the relevant module guide\u003c/li\u003e\u003c/ul\u003e", "workflow": "\u003ch3\u003e03 - Development Workflow\u003c/h3\u003e\u003ch3\u003ePurpose\u003c/h3\u003e\u003cp\u003eDefine the required code contribution process for this project.\u003c/p\u003e\u003cp\u003eThis document reflects the actual team workflow and must be followed exactly.\u003c/p\u003e\u003ch3\u003eCode Contribution Workflow\u003c/h3\u003e\u003cp\u003eIf a developer wants to commit code changes, use the following sequence.\u003c/p\u003e\u003ch4\u003e1) Stage all changes\u003c/h4\u003e\u003cp\u003eRun:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003egit add .\u003c/code\u003e\u003c/pre\u003e\u003ch4\u003e2) Create commit with interactive prompt\u003c/h4\u003e\u003cp\u003eRun:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eyarn commit\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eThen complete the prompts using these rules.\u003c/p\u003e\u003ch4\u003e3) Commit Type\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse \u003ccode\u003efix\u003c/code\u003e by default.\u003c/li\u003e\u003cli\u003eIf unsure, contact HISPVN-MK.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e4) Commit Scope\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eLeave blank.\u003c/li\u003e\u003cli\u003ePress Enter.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e5) Short Description\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eProvide a brief description of the change.\u003c/li\u003e\u003cli\u003eMaximum 95 characters.\u003c/li\u003e\u003cli\u003eExample:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003ewrong translation in EIR immunization form\u003c/code\u003e\u003c/pre\u003e\u003ch4\u003e6) Long Description\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eLeave blank.\u003c/li\u003e\u003cli\u003ePress Enter.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e7) Breaking Changes\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eAnswer \u003ccode\u003eNo\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e8) Open Issues\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eAnswer \u003ccode\u003eNo\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e9) Push changes\u003c/h4\u003e\u003cp\u003eRun:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003egit push\u003c/code\u003e\u003c/pre\u003e\u003ch4\u003e10) Pull Request action\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eDo not create a Pull Request yourself.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eDeveloper Responsibilities\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eFollow the commit prompt instructions in this document without deviation.\u003c/li\u003e\u003cli\u003eKeep the short description clear, specific, and under 95 characters.\u003c/li\u003e\u003cli\u003eAsk HISPVN-MK when commit type is unclear.\u003c/li\u003e\u003cli\u003ePush committed changes after completing the prompt flow.\u003c/li\u003e\u003cli\u003eAfter pushing, notify HISPVN-MK in the Collaborative Development channel.\u003c/li\u003e\u003cli\u003eInclude a concise summary of what was changed when notifying HISPVN-MK.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eReview and Merge Process\u003c/h3\u003e\u003cp\u003eAfter code is pushed:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eDeveloper notifies HISPVN-MK in the Collaborative Development channel.\u003c/li\u003e\u003cli\u003eNotification includes a summary of implemented changes.\u003c/li\u003e\u003cli\u003eHISPVN-MK reviews the pushed changes.\u003c/li\u003e\u003cli\u003eHISPVN-MK creates the Pull Request.\u003c/li\u003e\u003cli\u003eHISPVN-MK merges the Pull Request after review is complete.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThis repository uses a maintainer-managed review and merge model.\u003c/p\u003e", "codingStandards": "\u003ch2\u003e04 - Coding Standards\u003c/h2\u003e\u003ch3\u003ePurpose\u003c/h3\u003e\u003cp\u003eDefine enforceable coding standards for iCapture so internal and partner teams can ship consistent, maintainable, and reusable code.\u003c/p\u003e\u003ch3\u003eTarget\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eFrontend developers\u003c/li\u003e\u003cli\u003eTechnical leads and reviewers\u003c/li\u003e\u003cli\u003eExternal partner developers\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eScope\u003c/h3\u003e\u003cp\u003eThis document applies to all frontend code using:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eReact\u003c/li\u003e\u003cli\u003eJavaScript\u003c/li\u003e\u003cli\u003eShadcn UI\u003c/li\u003e\u003cli\u003eZustand\u003c/li\u003e\u003cli\u003eDHIS2 APIs\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e1. Naming Conventions\u003c/h3\u003e\u003ch4\u003e1.1 Components\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse \u003ccode\u003ePascalCase\u003c/code\u003e for component names and files.\u003c/li\u003e\u003cli\u003eComponent file names should match exported component name.\u003c/li\u003e\u003cli\u003eUse descriptive names tied to business intent, not visual implementation only.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExamples:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eProgramSummaryCard.jsx\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eDatasetEntryForm.jsx\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eOne primary component per file.\u003c/li\u003e\u003cli\u003ePrefer named exports for shared components; default export is allowed for route-level components.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e1.2 Hooks\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse \u003ccode\u003euse\u003c/code\u003e prefix and \u003ccode\u003ecamelCase\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eHook names must describe behavior, not UI location.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExamples:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003euseProgramMetadata\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003euseDatasetSubmission\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eHooks must be side-effect aware and return stable contracts.\u003c/li\u003e\u003cli\u003eDo not hide critical side effects in ambiguous names.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e1.3 Services\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse domain-focused \u003ccode\u003ecamelCase\u003c/code\u003e names with \u003ccode\u003eService\u003c/code\u003e suffix.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExamples:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eprogramService.js\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003etrackerService.js\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eServices own API interaction and mapping logic.\u003c/li\u003e\u003cli\u003eServices should not render UI or access browser-only UI state.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e1.4 Stores\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eZustand store files must use \u003ccode\u003e\u0026lt;domain\u0026gt;Store.js\u003c/code\u003e naming.\u003c/li\u003e\u003cli\u003eHook accessors should use \u003ccode\u003euse\u0026lt;Domain\u0026gt;Store\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExamples:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003emetadataStore.js\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003euseMetadataStore\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eKeep one bounded context per store.\u003c/li\u003e\u003cli\u003eStore action names must be verbs: \u003ccode\u003esetProgram\u003c/code\u003e, \u003ccode\u003eresetSelection\u003c/code\u003e, \u003ccode\u003etoggleDialog\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e1.5 Types\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eType aliases and interfaces use \u003ccode\u003ePascalCase\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eUse suffixes when it improves clarity.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExamples:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eProgramMetadata\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eDatasetSubmissionPayload\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eTrackerStoreState\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eAPI models: \u003ccode\u003e*Response\u003c/code\u003e, \u003ccode\u003e*Request\u003c/code\u003e, \u003ccode\u003e*Payload\u003c/code\u003e\u003c/li\u003e\u003cli\u003eUI models: \u003ccode\u003e*ViewModel\u003c/code\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e1.6 Constants\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse \u003ccode\u003eUPPER_SNAKE_CASE\u003c/code\u003e for compile-time constants.\u003c/li\u003e\u003cli\u003eGroup constants by domain in dedicated files.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExamples:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eDEFAULT_PAGE_SIZE\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eDHIS2_API_VERSION\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003ePROGRAM_STATUS\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eDo not inline repeated literals across modules.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e2. File Organization Standards\u003c/h3\u003e\u003cp\u003eUse feature-first organization for business modules and shared folders for cross-cutting code.\u003c/p\u003e\u003cp\u003eRecommended shape:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003esrc/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003efeatures/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003etracker/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003ecomponents/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003ehooks/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eservices/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003etypes/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eindex.js\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003ecomponents/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003ecommon/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eui/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003estores/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eservices/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eapis/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eutils/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003etypes/\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eKeep feature logic inside feature folders.\u003c/li\u003e\u003cli\u003eMove only genuinely reusable code to shared folders.\u003c/li\u003e\u003cli\u003eAvoid circular imports between features and shared modules.\u003c/li\u003e\u003cli\u003eKeep barrel files small and intentional.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eFile splitting guidance:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eIf a file exceeds approximately 300 lines with mixed concerns, split by responsibility.\u003c/li\u003e\u003cli\u003eSeparate component rendering, business logic, and data access.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e3. Function Documentation Standards\u003c/h3\u003e\u003cp\u003eEvery exported function must include a documentation block with:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003ePurpose\u003c/li\u003e\u003cli\u003eParameters\u003c/li\u003e\u003cli\u003eReturn value\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eTemplate:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e/**\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Purpose:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* \u0026lt;what the function does and why\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Parameters:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* - \u0026lt;name\u0026gt;: \u0026lt;description\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Return:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* \u0026lt;what is returned\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*/\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRequired for:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eExported utility functions\u003c/li\u003e\u003cli\u003eService/API functions\u003c/li\u003e\u003cli\u003eCustom hooks\u003c/li\u003e\u003cli\u003eNon-trivial store actions\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eOptional for:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eSmall private helpers where intent is obvious\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExample:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e/**\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Purpose:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Fetch program metadata from DHIS2 and map it to UI-safe shape.\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Parameters:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* - programId: DHIS2 program identifier.\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Return:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Program metadata object used by iCapture forms.\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*/\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eexport async function getProgramMetadata(programId: string): Promise\u0026lt;ProgramMetadata\u0026gt; {\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e// implementation\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e}\u003c/code\u003e\u003c/pre\u003e\u003ch3\u003e4. Component Documentation Standards\u003c/h3\u003e\u003cp\u003eEvery reusable component must include a top-level documentation block.\u003c/p\u003e\u003cp\u003eTemplate:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e/**\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Purpose:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* \u0026lt;component responsibility\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Props:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* - \u0026lt;propName\u0026gt;: \u0026lt;description\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* Behavior:\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e* \u0026lt;important rendering, state, and side-effect notes\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e*/\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eComponent rules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eDefine explicit prop types.\u003c/li\u003e\u003cli\u003eKeep components focused on one clear responsibility.\u003c/li\u003e\u003cli\u003eMove heavy logic to hooks/services.\u003c/li\u003e\u003cli\u003eAdd accessibility requirements for interactive controls.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eShadcn UI specific:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003ePrefer shared design tokens over hardcoded colors and spacing.\u003c/li\u003e\u003cli\u003eCompose UI from shared primitives in \u003ccode\u003ecomponents/ui\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eWrap repeated Shadcn composition patterns into shared reusable components.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e5. State Management Standards (Zustand)\u003c/h3\u003e\u003ch4\u003e5.1 Store Design\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eOne store per domain boundary.\u003c/li\u003e\u003cli\u003eDefine \u003ccode\u003estate\u003c/code\u003e, \u003ccode\u003eactions\u003c/code\u003e, and \u003ccode\u003ereset\u003c/code\u003e behavior clearly.\u003c/li\u003e\u003cli\u003eKeep store initialization deterministic.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e5.2 Selectors\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse selectors to subscribe only to required slices.\u003c/li\u003e\u003cli\u003eAvoid selecting whole store objects in large components.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e5.3 Actions\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eActions must be predictable and side-effect minimal.\u003c/li\u003e\u003cli\u003eName actions with intention-revealing verbs.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e5.4 Side Effects\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eAPI calls should live in services/hooks, not inside store definition blocks.\u003c/li\u003e\u003cli\u003eStore actions can coordinate data updates after service calls complete.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e5.5 Store Documentation\u003c/h4\u003e\u003cp\u003eDocument each store with:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eDomain ownership\u003c/li\u003e\u003cli\u003eState fields\u003c/li\u003e\u003cli\u003eAction responsibilities\u003c/li\u003e\u003cli\u003eReset semantics\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e6. API Integration Standards (DHIS2)\u003c/h3\u003e\u003ch4\u003e6.1 API Layering\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse shared HTTP wrappers for transport behavior.\u003c/li\u003e\u003cli\u003eKeep endpoint definitions in domain API modules.\u003c/li\u003e\u003cli\u003eKeep data mapping in converter functions.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e6.2 Naming\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse \u003ccode\u003egetX\u003c/code\u003e, \u003ccode\u003esearchX\u003c/code\u003e, \u003ccode\u003esaveX\u003c/code\u003e, \u003ccode\u003edeleteX\u003c/code\u003e patterns.\u003c/li\u003e\u003cli\u003eSuffix payload contracts with \u003ccode\u003eRequest\u003c/code\u003e or \u003ccode\u003ePayload\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e6.3 Request Rules\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eValidate required identifiers before calling API.\u003c/li\u003e\u003cli\u003eEncode query parameters safely.\u003c/li\u003e\u003cli\u003eDo not build complex query strings in UI components.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e6.4 Response Rules\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNormalize API responses before storing in Zustand.\u003c/li\u003e\u003cli\u003eAvoid passing raw DHIS2 payloads through multiple UI layers when a mapped model exists.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e6.5 API Documentation\u003c/h4\u003e\u003cp\u003eEvery exported API function must include Purpose, Parameters, and Return documentation.\u003c/p\u003e\u003ch3\u003e7. Error Handling Standards\u003c/h3\u003e\u003ch4\u003e7.1 Error Categories\u003c/h4\u003e\u003cp\u003eHandle errors by category:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNetwork/transport errors\u003c/li\u003e\u003cli\u003eAuthentication/authorization errors\u003c/li\u003e\u003cli\u003eValidation/business rule errors\u003c/li\u003e\u003cli\u003eUnexpected runtime errors\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e7.2 User Messaging\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eProvide actionable and non-technical messages in UI.\u003c/li\u003e\u003cli\u003eKeep technical details in logs, not end-user dialogs.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e7.3 Logging\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eLog enough context for debugging: endpoint, identifiers, action.\u003c/li\u003e\u003cli\u003eNever log secrets or credentials.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e7.4 Recovery Strategy\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eDefine retry behavior for transient failures.\u003c/li\u003e\u003cli\u003eProvide fallback UI states (loading, empty, error).\u003c/li\u003e\u003cli\u003eAvoid silent failures.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e7.5 Error Object Shape\u003c/h4\u003e\u003cp\u003eStandardize error objects for consistency across features.\u003c/p\u003e\u003cp\u003eSuggested fields:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003ecode\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003emessage\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003econtext\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003erecoverable\u003c/code\u003e\u003c/pre\u003e\u003ch3\u003e8. Before push code Checklist\u003c/h3\u003e\u003cp\u003eAll code before push must satisfy the following:\u003c/p\u003e\u003ch4\u003eCode Quality\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNaming conventions follow this standard\u003c/li\u003e\u003cli\u003eFile placement follows feature/shared boundaries\u003c/li\u003e\u003cli\u003eFunction and component docs added for new exports\u003c/li\u003e\u003cli\u003eNo duplicate logic introduced\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eBehavior and Safety\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eState updates are predictable and manually verified\u003c/li\u003e\u003cli\u003eAPI calls use service/API layers only\u003c/li\u003e\u003cli\u003eError handling is implemented for failure paths\u003c/li\u003e\u003cli\u003eLoading/empty/error UI states are handled\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eDocumentation\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRelevant docs updated (including this file when standards changed)\u003c/li\u003e\u003cli\u003eScreenshots or videos included for UI changes\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e9. Code Review Checklist\u003c/h3\u003e\u003cp\u003eReviewers must validate:\u003c/p\u003e\u003ch4\u003eArchitecture\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eChange aligns with module boundaries\u003c/li\u003e\u003cli\u003eReuse preferred over new abstractions\u003c/li\u003e\u003cli\u003eNo hidden coupling introduced\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eReadability and Maintainability\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eNames are clear and intention-revealing\u003c/li\u003e\u003cli\u003eComplex logic extracted into hooks/services/utilities\u003c/li\u003e\u003cli\u003ePublic functions/components are documented\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eState and Data Flow\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eZustand selectors are scoped correctly\u003c/li\u003e\u003cli\u003eStore actions remain deterministic\u003c/li\u003e\u003cli\u003eAPI mapping is explicit and type-safe\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eResilience\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eError cases handled correctly\u003c/li\u003e\u003cli\u003eUser-facing messages are useful\u003c/li\u003e\u003cli\u003eNo sensitive data exposure in logs\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eDelivery Quality\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eManual verification checklist is appropriate to risk\u003c/li\u003e\u003cli\u003eDocumentation impact is addressed\u003c/li\u003e\u003c/ul\u003e", "componentCatalog": "\u003ch2\u003e05 - Component Catalog\u003c/h2\u003e\u003ch3\u003ePurpose\u003c/h3\u003e\u003cp\u003eProvide a complete catalog of reusable components under \u003ccode\u003esrc/components\u003c/code\u003e to standardize implementation and prevent duplicate UI/feature primitives.\u003c/p\u003e\u003ch3\u003eTarget\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eFrontend developers\u003c/li\u003e\u003cli\u003eExternal partner contributors\u003c/li\u003e\u003cli\u003eReviewers validating reuse and consistency\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eScope\u003c/h3\u003e\u003cp\u003eThis catalog is generated from all files under:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003esrc/components/ui\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003esrc/components/dhis2\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003esrc/components/layout\u003c/code\u003e\u003c/pre\u003e\u003ch3\u003eClassification Rules\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eShared Components: reusable across multiple features or domains.\u003c/li\u003e\u003cli\u003eFeature Components: tightly coupled to tracker/event/aggregate workflows and should remain feature-bound.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eShared Components\u003c/h3\u003e\u003ch4\u003e1) Button Family\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eButton\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/ui/button.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: Generic action button with variants and sizes.\u003c/li\u003e\u003cli\u003eMain props: \u003ccode\u003evariant\u003c/code\u003e, \u003ccode\u003esize\u003c/code\u003e, \u003ccode\u003eclassName\u003c/code\u003e, \u003ccode\u003easChild\u003c/code\u003e, native button props (\u003ccode\u003eonClick\u003c/code\u003e, \u003ccode\u003edisabled\u003c/code\u003e, \u003ccode\u003etype\u003c/code\u003e).\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;Button variant=\"success\" size=\"lg\" onClick={handleSubmit}\u0026gt;Save\u0026lt;/Button\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: all primary/secondary actions.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: \u003ccode\u003eLoadingButton\u003c/code\u003e, pagination controls.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e2) LoadingButton\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eLoadingButton\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/ui/loadingbutton.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: Button with built-in loading state and spinner.\u003c/li\u003e\u003cli\u003eMain props: \u003ccode\u003eloading\u003c/code\u003e, all \u003ccode\u003eButton\u003c/code\u003e props.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;LoadingButton loading={isSaving} onClick={onSave}\u0026gt;Save\u0026lt;/LoadingButton\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: async save/delete/submit actions.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: \u003ccode\u003eButton\u003c/code\u003e + custom spinner wrappers.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e3) Input\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eInput\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/ui/input.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: Single-line text-like input wrapper.\u003c/li\u003e\u003cli\u003eMain props: \u003ccode\u003etype\u003c/code\u003e, \u003ccode\u003evalue\u003c/code\u003e, \u003ccode\u003eonChange\u003c/code\u003e, \u003ccode\u003eplaceholder\u003c/code\u003e, \u003ccode\u003edisabled\u003c/code\u003e, \u003ccode\u003eclassName\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;Input value={name} onChange={(e) =\u0026gt; setName(e.target.value)} placeholder=\"Name\" /\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: text, number, email, password input.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: \u003ccode\u003eTextarea\u003c/code\u003e, \u003ccode\u003eDatePicker\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e4) Textarea\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eTextarea\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/ui/textarea.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: Multi-line text input.\u003c/li\u003e\u003cli\u003eMain props: \u003ccode\u003evalue\u003c/code\u003e, \u003ccode\u003eonChange\u003c/code\u003e, \u003ccode\u003eplaceholder\u003c/code\u003e, \u003ccode\u003edisabled\u003c/code\u003e, \u003ccode\u003eclassName\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;Textarea value={notes} onChange={(e) =\u0026gt; setNotes(e.target.value)} /\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: comments, descriptions, notes.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: \u003ccode\u003eInput\u003c/code\u003e with manual row hacks.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e5) Label\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eLabel\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/ui/label.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: Accessible form label wrapper.\u003c/li\u003e\u003cli\u003eMain props: \u003ccode\u003ehtmlFor\u003c/code\u003e, \u003ccode\u003eclassName\u003c/code\u003e, label attributes.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;Label htmlFor=\"email\"\u0026gt;Email\u0026lt;/Label\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: every form field label.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: custom \u003ccode\u003espan\u003c/code\u003e labels without accessibility mapping.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e6) InputHelper\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eInputHelper\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/ui/inputhelper.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: Inline helper/validation message renderer.\u003c/li\u003e\u003cli\u003eMain props: \u003ccode\u003etype\u003c/code\u003e (\u003ccode\u003eerror|warning|info\u003c/code\u003e), \u003ccode\u003ehtml\u003c/code\u003e, children.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;InputHelper type=\"error\"\u0026gt;Required field\u0026lt;/InputHelper\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: validation hints below fields.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: ad-hoc red text blocks.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e7) Checkbox\u003c/h4\u  with dirty-state protection.\u003c/li\u003e\u003cli\u003eMain props: none.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;EventRegisterSection /\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: event program list/capture workflows.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: additional event registration action bars.\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e5) TrackerRegisterSection\u003c/h4\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name: \u003ccode\u003eTrackerRegisterSection\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFile location: \u003ccode\u003esrc/components/layout/control-bar/tracker-register-section.jsx\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePurpose: TEI registration/search actions for tracker programs.\u003c/li\u003e\u003cli\u003eMain props: none.\u003c/li\u003e\u003cli\u003eExample usage:\u003c/li\u003e\u003c/ul\u003e\u003cpre\u003e\u003ccode\u003e\u0026lt;TrackerRegisterSection /\u0026gt;\u003c/code\u003e\u003c/pre\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eRecommended use cases: tracker list/registration flows.\u003c/li\u003e\u003cli\u003eSimilar components that should not be duplicated: alternative tracker register controls.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eDuplicate Prevention Matrix\u003c/h3\u003e\u003cp\u003eBefore creating a new component, check this matrix first:\u003c/p\u003e\u003cdiv class=\"handbook-table-wrap\"\u003e\u003ctable class=\"handbook-table\"\u003e\u003ctr\u003e\u003cth\u003e\u003cp\u003eNeed\u003c/p\u003e\u003c/th\u003e\u003cth\u003e\u003cp\u003eUse Existing\u003c/p\u003e\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eAction with spinner\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003eLoadingButton\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eSingle searchable choice\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003eSelect\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eMultiple searchable choices\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003eMultiSelect\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eGeneric modal\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003e\u003ccode\u003eDialog\u003c/code\u003e family\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eConfirmation modal\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003e\u003ccode\u003eAlertDialog\u003c/code\u003e family\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eInline warning/info\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003e\u003ccode\u003eAlert\u003c/code\u003e family\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eOrg unit selection\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003eOrgUnitSelector\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003ePeriod selection\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003ePeriodSelector\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eMetadata-driven DHIS2 field\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003e\u003ccode\u003eDhis2Input\u003c/code\u003e / \u003ccode\u003eRhfDhis2Input\u003c/code\u003e\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eDataset form field\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003eRhfAggregateDhis2Input\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eFile upload for events\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003eDhis2FileInput\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eFile upload generic\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ccode\u003eFilePicker\u003c/code\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003eTable rendering\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003e\u003ccode\u003eTable\u003c/code\u003e family\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003ePagination controls\u003c/p\u003e\u003c/td\u003e\u003ctd\u003e\u003cp\u003e\u003ccode\u003ePagination\u003c/code\u003e family\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e", "trackerDevelopment": "\u003ch2\u003e6. Create a New Tracker Program\u003c/h2\u003e\u003ch3\u003eScenario\u003c/h3\u003e\u003cp\u003eWe want to create a new Tracker program called ANC.\u003c/p\u003e\u003cp\u003eWe will use the existing PNC implementation as a template.\u003c/p\u003e\u003ch3\u003eStep 1 - Create the Program Folder\u003c/h3\u003e\u003cp\u003eCopy this folder:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003esrc/extensions/tracker/programs/pnc\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eInto this folder:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003esrc/extensions/tracker/programs/anc\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRename files from PNC naming to ANC naming.\u003c/p\u003e\u003cp\u003eExample rename map:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003epnc-enrollment-form.jsx -\u0026gt; anc-enrollment-form.jsx\u003c/li\u003e\u003cli\u003epnc-profile.jsx -\u0026gt; anc-profile.jsx\u003c/li\u003e\u003cli\u003epnc-stage.jsx -\u0026gt; anc-stage.jsx\u003c/li\u003e\u003cli\u003epncProfileRules.js -\u0026gt; ancProfileRules.js\u003c/li\u003e\u003cli\u003epncStageRules.js -\u0026gt; ancStageRules.js\u003c/li\u003e\u003cli\u003econst.js -\u0026gt; const.js (keep file name, update content)\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eComplete expected folder structure:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003esrc/extensions/tracker/programs/anc/\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e├── const.js\u003c/p\u003e\u003cp\u003e├── anc-enrollment-form.jsx\u003c/p\u003e\u003cp\u003e├── anc-profile.jsx\u003c/p\u003e\u003cp\u003e├── anc-stage.jsx\u003c/p\u003e\u003cp\u003e├── ancProfileRules.js\u003c/p\u003e\u003cp\u003e└── ancStageRules.js\u003c/p\u003e\u003ch3\u003eStep 2 - Update Constants\u003c/h3\u003e\u003cp\u003eModify these files:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/const.js\u003c/li\u003e\u003cli\u003esrc/extensions/tracker/const.js\u003c/li\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/anc-profile.jsx\u003c/li\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/anc-stage.jsx\u003c/li\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/anc-enrollment-form.jsx\u003c/li\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/ancStageRules.js\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eWhat to replace:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eProgram ID\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC example from src/extensions/tracker/const.js:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003ePNC: \"u1Na9wCGY6d\"\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eANC example in same file:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eANC: \"fflLsS1lm3g\"\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eIf you are creating a brand new DHIS2 program (not the existing ANC in this repo), replace with that program UID.\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eProgram Stage IDs\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC example from src/extensions/tracker/programs/pnc/const.js:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eexport const PNC_PROGRAM_STAGE = \"huYWjrG6A1C\";\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eIn ANC const.js, define ANC stage constant(s) and replace all imports/usages in forms and rules.\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eData Element IDs\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC example from src/extensions/tracker/programs/pnc/const.js:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eexport const PNC_DATA_ELEMENTS = {\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eVISIT_NUMBER: \"LvSuOSBXj10\",\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eNEXT_APPOINTMENT_DATE: \"Rg0YjOCLnsl\",\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eMCH_BOOK: \"GgfEUl3oXi6\"\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e};\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eIn ANC const.js, create ANC data element map and replace every PNC data element reference.\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eAttribute IDs\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC uses shared attributes from src/extensions/tracker/const.js via ALL_CHR_ATTRIBUTES (for example HEALTH_ID, PROVINCE, MOBILE, DOB) and one module-level mapping MCH_BOOK_ATTRIBUTE in pnc const.js.\u003c/p\u003e\u003cp\u003eFor ANC, replace attribute constants only when ANC metadata requires different attributes. Keep shared ALL_CHR_ATTRIBUTES usage when IDs are the same.\u003c/p\u003e\u003ch3\u003eStep 3 - Create ANC Forms\u003c/h3\u003e\u003ch4\u003eEnrollment form\u003c/h4\u003e\u003cp\u003eCopy:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/pnc/pnc-enrollment-form.jsx\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eTo:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/anc-enrollment-form.jsx\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eUpdate these sections:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name and export\u003c/li\u003e\u003cli\u003eImport from ANC const file instead of PNC const file\u003c/li\u003e\u003cli\u003ePayload programStage and dataValues mapping\u003c/li\u003e\u003cli\u003eRequired field validation logic in change function\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC reference points:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUses PNC_PROGRAM_STAGE in enrollment payload\u003c/li\u003e\u003cli\u003eUses PNC_DATA_ELEMENTS values for dataValues\u003c/li\u003e\u003cli\u003eCalls saveEnrollment, enrollChr, saveTei\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003eProfile form\u003c/h4\u003e\u003cp\u003eCopy:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/pnc/pnc-profile.jsx\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eTo:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/anc-profile.jsx\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eUpdate these sections:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eComponent name and export\u003c/li\u003e\u003cli\u003eANC-specific special field handling if needed\u003c/li\u003e\u003cli\u003eKeep metadata-driven loop:\nconst attributes = program.programTrackedEntityAttributes.map((ptea) =\u0026gt; ptea.trackedEntityAttribute.id);\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eChange metadata references only if ANC rules require different behavior for specific attributes.\u003c/p\u003e\u003ch4\u003eStage form\u003c/h4\u003e\u003cp\u003eCopy:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/pnc/pnc-stage.jsx\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eTo:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/anc-stage.jsx\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eUpdate these sections:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eImport ANC stage constant and ANC data element constants\u003c/li\u003e\u003cli\u003eProgram stage lookup constant\u003c/li\u003e\u003cli\u003eANC-specific field behavior (for example maxDate/custom logic)\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC reference pattern:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003econst programStage = program.programStages.find((ps) =\u0026gt; ps.id === PNC_PROGRAM_STAGE);\u003c/code\u003e\u003c/pre\u003e\u003ch3\u003eStep 4 - Create ANC Rules\u003c/h3\u003e\u003cp\u003eHow PNC rules are implemented:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eProfile rules: src/extensions/tracker/programs/pnc/pncProfileRules.js\u003c/li\u003e\u003cli\u003eStage rules: src/extensions/tracker/programs/pnc/pncStageRules.js\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC profile rules pattern:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eimport { commonChrProfileRules } from \"@/extensions/tracker/programs/common/commonRules\";\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003econst rules = [...commonChrProfileRules];\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eexport default rules;\u003c/code\u003e\u003c/pre\u003e\u003cp\u003ePNC stage rule pattern uses:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003ewatches\u003c/li\u003e\u003cli\u003eexpression\u003c/li\u003e\u003cli\u003eactionsWhenPassed\u003c/li\u003e\u003cli\u003eactionsWhenFailed\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExample from PNC stage rules:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e{\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eexpression: ({ currentValues }) =\u0026gt; currentValues[VISIT_NUMBER] !== \"1\",\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003ewatches: [VISIT_NUMBER],\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eactionsWhenPassed: [\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e{ targets: [WITH_IN_24H], type: \"hide\" },\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e{ targets: [WITH_IN_24H], type: \"assign\", generateValue: () =\u0026gt; \"\" }\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e],\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eactionsWhenFailed: []\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e}\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eHow to create ANC rules:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eCopy PNC rule files to ANC rule files.\u003c/li\u003e\u003cli\u003eReplace PNC constants with ANC constants.\u003c/li\u003e\u003cli\u003eReplace PNC-specific logic with ANC business rules.\u003c/li\u003e\u003cli\u003eKeep the same rule object structure so the existing rule engine can execute it.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eStep 5 - Register ANC in programConfig\u003c/h3\u003e\u003cp\u003eModify file:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/programConfig.js\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExisting PNC registration:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e[PNC]: {\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofile: PncProfile,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofileRules: pncProfileRules,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofileSaveMethod: chrProfileSave,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003edashboard: MchDashboard,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003edashboardTitleAttributes: [HEALTH_ID, FIRST_NAME],\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eenrollmentForm: PncEnrollmentForm,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e[PNC_PROGRAM_STAGE + \"stage\"]: PncStage,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e[PNC_PROGRAM_STAGE + \"rules\"]: pncStageRules,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003euseSequence: true\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e}\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eExample ANC registration:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e[ANC]: {\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofile: AncProfile,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofileRules: ancProfileRules,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofileSaveMethod: chrProfileSave,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003edashboard: MchDashboard,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003edashboardTitleAttributes: [HEALTH_ID, FIRST_NAME],\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eenrollmentForm: AncEnrollmentForm,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e[ANC_PROGRAM_STAGE + \"stage\"]: AncStage,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e[ANC_PROGRAM_STAGE + \"rules\"]: ancStageRules,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003euseSequence: true\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e}\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eProperty guide:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eprofile: ANC profile form component\u003c/li\u003e\u003cli\u003eprofileRules: ANC profile rule array\u003c/li\u003e\u003cli\u003eprofileSaveMethod: profile save strategy (CHR flow uses chrProfileSave)\u003c/li\u003e\u003cli\u003edashboard: dashboard component used for this program\u003c/li\u003e\u003cli\u003edashboardTitleAttributes: TEA list shown in dashboard header\u003c/li\u003e\u003cli\u003eenrollmentForm: ANC enrollment form component\u003c/li\u003e\u003cli\u003e[STAGE + \"stage\"]: form component for that stage\u003c/li\u003e\u003cli\u003e[STAGE + \"rules\"]: rule array for that stage\u003c/li\u003e\u003cli\u003euseSequence: enables numbered field sequence in stage form\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eStep 6 (Optional) - Link ANC to CHR\u003c/h3\u003e\u003cp\u003eUse this step only if your new tracker program should use CHR search/registration behavior.\u003c/p\u003e\u003ch4\u003e6.1 Add your program in useSearchChr\u003c/h4\u003e\u003cp\u003eModify file:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/hooks/useSearchChr.jsx\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePNC/ANC reference pattern in this file:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003econst { ANC, PNC, DELIVERY, FAMILY_PLANNING, EIR, CHR, SURVEILLANCE_2_0, AEFI } = ALL_PROGRAMS;\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e...\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e} else if (program \u0026amp;\u0026amp; [ANC, PNC, DELIVERY, FAMILY_PLANNING, EIR, SURVEILLANCE_2_0, AEFI].includes(program.id)) {\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eIf your new program is not already in this list, add it to both:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003ethe constant destructuring from \u003ccode\u003eALL_PROGRAMS\u003c/code\u003e\u003c/li\u003e\u003cli\u003ethe \u003ccode\u003e.includes(program.id)\u003c/code\u003e list\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e6.2 Use chrProfileSave in programConfig\u003c/h4\u003e\u003cp\u003eModify file:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/programs/programConfig.js\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eFor CHR-linked programs, set:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eprofileSaveMethod: chrProfileSave,\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eExample (already used by PNC and ANC):\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e[ANC]: {\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofile: AncProfile,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofileRules: ancProfileRules,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003eprofileSaveMethod: chrProfileSave,\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e...\u003c/code\u003e\u003c/pre\u003e\u003cpre\u003e\u003ccode\u003e}\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eIf \u003ccode\u003eprofileSaveMethod\u003c/code\u003e is different, CHR-linked save behavior will not follow the same flow.\u003c/p\u003e\u003ch3\u003eStep 7 - Register ANC Program ID\u003c/h3\u003e\u003cp\u003eModify file:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003esrc/extensions/tracker/const.js\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eExisting PNC constant:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003ePNC: \"u1Na9wCGY6d\"\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eANC constant example:\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eANC: \"fflLsS1lm3g\"\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eWhere the new program ID comes from:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eUse the DHIS2 Program UID from your target environment metadata.\u003c/li\u003e\u003cli\u003eIn this repository, program metadata is loaded by src/hooks/useInit.js using getPrograms.\u003c/li\u003e\u003cli\u003eIf this is a truly new program, use that new UID in ALL_PROGRAMS and in your ANC-specific constants.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eStep 8 - Verify Metadata\u003c/h3\u003e\u003cp\u003eChecklist before coding:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eProgram exists in DHIS2 metadata\u003c/li\u003e\u003cli\u003eProgram stage(s) exist\u003c/li\u003e\u003cli\u003eRequired tracked entity attributes exist\u003c/li\u003e\u003cli\u003eRequired data elements exist\u003c/li\u003e\u003cli\u003eProgram is assigned to expected org units\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eHow to verify before coding:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eConfirm IDs in DHIS2 metadata (Program, Program Stage, TEAs, DEs).\u003c/li\u003e\u003cli\u003eConfirm the same IDs are placed in:\u003c/li\u003e\u003cli\u003esrc/extensions/tracker/const.js\u003c/li\u003e\u003cli\u003esrc/extensions/tracker/programs/anc/const.js\u003c/li\u003e\u003cli\u003eStart app and verify program appears in selector after metadata bootstrap.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eStep 9 - Manually Verify the New Program\u003c/h3\u003e\u003cp\u003eManual verification checklist:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eOpen Tracker page\u003c/li\u003e\u003cli\u003eSelect ANC program\u003c/li\u003e\u003cli\u003eCreate enrollment\u003c/li\u003e\u003cli\u003eUpdate profile\u003c/li\u003e\u003cli\u003eCreate event\u003c/li\u003e\u003cli\u003eEdit event\u003c/li\u003e\u003cli\u003eVerify data saved in DHIS2\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePractical validation points:\u003c/p\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eEnrollment creates expected initial data\u003c/li\u003e\u003cli\u003eProfile save persists TEA values\u003c/li\u003e\u003cli\u003eStage rules trigger expected hide/disable/error behavior\u003c/li\u003e\u003cli\u003eEvent save and complete/incomplete flows work correctly\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eCommon Mistakes\u003c/h3\u003e\u003cul class=\"handbook-list\"\u003e\u003cli\u003eForgot to register ANC in src/extensions/tracker/programs/programConfig.js\u003c/li\u003e\u003cli\u003eWrong Program Stage ID in anc const.js\u003c/li\u003e\u003cli\u003eWrong Data Element ID mapping in anc const.js\u003c/li\u003e\u003cli\u003eMissing rule registration in programConfig\u003c/li\u003e\u003cli\u003eProgram ID in ALL_PROGRAMS does not match DHIS2 metadata\u003c/li\u003e\u003cli\u003eProgram not added to src/extensions/tracker/hooks/useSearchChr.jsx for CHR-linked flows\u003c/li\u003e\u003cli\u003eprofileSaveMethod is not set to chrProfileSave for CHR-linked flows\u003c/li\u003e\u003cli\u003eCopied PNC imports still pointing to pnc paths\u003c/li\u003e\u003cli\u003eEnrollment payload still using PNC stage/data element constants\u003c/li\u003e\u003cli\u003eMetadata missing in DHIS2 (program/stage/TEA/DE not available)\u003c/li\u003e\u003c/ul\u003e"};

  try{collapsed=localStorage.getItem(KEY)==='1'}catch(e){}
  function labels(){document.querySelectorAll('#gNav .gitem').forEach(function(b){var l=b.querySelector('.glabel');b.title=collapsed&&l?l.textContent:''})}
  function apply(){
    body.classList.toggle('sb-collapsed',collapsed);body.classList.toggle('sb-lesson',lesson);
    var c=document.getElementById('gCollapse');if(c)c.setAttribute('aria-label',collapsed?'Expand sidebar':'Collapse sidebar');
    var bg=document.getElementById('gBurger');if(bg){var o=body.classList.contains('sb-open');bg.setAttribute('aria-expanded',o);bg.setAttribute('aria-label',o?'Close menu':'Open menu')}
    labels();
  }
  window.sbToggleCollapse=function(){collapsed=!collapsed;if(!lesson){try{localStorage.setItem(KEY,collapsed?'1':'0')}catch(e){}}apply()};
  window.sbToggleDrawer=function(){body.classList.toggle('sb-open');apply()};
  window.sbCloseDrawer=function(){body.classList.remove('sb-open');apply()};
  function setLesson(on){
    if(on===lesson)return;
    if(on){saved=collapsed;collapsed=true}else{if(saved!==null)collapsed=saved;saved=null}
    lesson=on;apply();
  }
  var _nav=navActive;navActive=function(w){setLesson(false);return _nav(w)};
  var _lesson=renderLesson;renderLesson=function(){setLesson(true);return _lesson.apply(this,arguments)};
  document.getElementById('gNav').addEventListener('click',function(e){if(e.target.closest('.gitem'))sbCloseDrawer()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')sbCloseDrawer()});
  window.addEventListener('resize',function(){if(window.innerWidth>1050)sbCloseDrawer()});
  apply();
})();
/* ===== Browser history & deep links =====
   Every screen gets a readable URL hash, so the browser Back/Forward buttons and shared links work:
     #/home   #/programs   #/annex/G2   #/handbook-doc/readme
     #/lesson/<lesson>/<stepId>[/<A|B>]        e.g.  #/lesson/comm/SUR-DE-003/A
   The existing navigation functions (and their onclick handlers) are unchanged. They are wrapped here so that,
   after rendering, they record the new screen in the URL. A popstate/hashchange handler replays the URL.
   Anything read back from the URL is validated against known IDs before it is used. */
(() => {
  const VIEWS = {
    'home':           { fn: 'showHome',                   view: 'home' },
    'about':          { fn: 'showAbout',                  view: 'about' },
    'programs':       { fn: 'showPrograms',               view: 'programs' },
    'areas':          { fn: 'showAreas',                  view: 'areas' },
    'data-entry':     { fn: 'showDataEntryModules',       view: 'dataEntryModules' },
    'mch':            { fn: 'showMchAreas',               view: 'mchAreas' },
    'mch-entry':      { fn: 'showMchDataEntryModules',    view: 'mchDataEntryModules' },
    'mch-delivery':   { fn: 'showMchDeliveryModules',     view: 'mchDeliveryModules' },
    'mch-analysis':   { fn: 'showMchDataAnalysisModules', view: 'mchDataAnalysisModules' },
    'mch-indicators': { fn: 'showMchIndicatorCatalog',   view: 'mchIndicatorCatalog',
                        arg: () => window.mchIndicatorCatalogType,
                        valid: a => a === 'anc' || a === 'delivery' },
    'resources':      { fn: 'showResources',              view: 'resources' },
    'developments':   { fn: 'showDevelopments',           view: 'developments' },
    'developer':      { fn: 'showDeveloperPaths',         view: 'developer' },
    'handbook':       { fn: 'showHandbook',               view: 'handbook' },
    'program':        { fn: 'showProgramAbout',      view: 'programAbout',
                        arg: () => window.programAbout,
                        valid: a => a === 'diseaseSurveillance' },
    'developer-path': { fn: 'showDeveloperPath',     view: 'developerDetail',
                        arg: () => window.developerSelection,
                        valid: a => developerPaths.some(p => p.id === a) },
    'handbook-doc':   { fn: 'showHandbookDocument',  view: 'handbookDoc',
                        arg: () => window.handbookSelection,
                        valid: a => handbookChapters.some(c => c.id === a) },
    'annex':          { fn: 'showAnnex',             view: ['annex', 'annexSkill'], optional: true,
                        arg: () => window.annexSelection,
                        valid: a => !!findAnnexSkill(a) },
    'placeholder':    { fn: 'showPlaceholder',       view: 'placeholder',
                        arg: () => 'updates',
                        valid: a => a === 'updates' }
  };

  const LESSONS = {
    'comm':         { lesson: 'entry',    entry: 'communicable' },
    'anc':          { lesson: 'entry',    entry: 'anc' },
    'delivery-mother': { lesson: 'entry', entry: 'deliveryMother' },
    'delivery-infant': { lesson: 'entry', entry: 'deliveryInfant' },
    'malaria':      { lesson: 'entry',    entry: 'malaria' },
    'zero':         { lesson: 'entry',    entry: 'zero' },
    'weekly':       { lesson: 'entry',    entry: 'weekly' },
    'analysis':     { lesson: 'analysis', analysis: 'surv' },
    'anc-analysis': { lesson: 'analysis', analysis: 'anc' },
    'delivery-analysis': { lesson: 'analysis', analysis: 'delivery' },
    'report':       { lesson: 'report' }
  };

  const own = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);   // URL text must never reach Object.prototype

  let restoring = true;   // stays true until the first route(), so startup renders never touch history
  let lastHash = '';
  const initialHash = location.hash;

  const lessonKey = () => Object.keys(LESSONS).find(k => {
    const L = LESSONS[k];
    return L.lesson === activeLesson
      && (!L.entry || L.entry === activeEntryType)
      && (!L.analysis || L.analysis === activeAnalysisType);
  });

  /* The URL for whatever is on screen right now, derived from the app's own state. */
  function currentHash() {
    if (document.querySelector('.lesson-layout')) {
      return '#/lesson/' + lessonKey() + '/' + encodeURIComponent(current) + (activePath ? '/' + activePath : '');
    }
    const view = window.currentView || 'home';
    const route = Object.keys(VIEWS).find(r => [].concat(VIEWS[r].view).includes(view)) || 'home';
    const arg = VIEWS[route].arg && VIEWS[route].arg();
    return '#/' + route + (arg ? '/' + encodeURIComponent(arg) : '');
  }

  function record() {
    hidePortalSearch(true);
    if (restoring) return;
    const hash = currentHash();
    if (hash === lastHash) return;
    history.pushState(null, '', hash);
    lastHash = hash;
  }

  function openView(v, arg) {
    if (!v.valid) { window[v.fn](); return true; }
    if (arg === undefined || arg === '') {
      if (!v.optional) return false;
      window[v.fn]();
      return true;
    }
    if (!v.valid(arg)) return false;
    window[v.fn](arg);
    return true;
  }

  function openLesson(key, step, path) {
    if (key === 'anc' && step === 'MCH-ANC-020') step = 'MCH-ANC-019';
    if (!own(LESSONS, key) || !/^[A-Za-z0-9-]+$/.test(step || '')) return false;
    const L = LESSONS[key];
    activeLesson = L.lesson;
    if (L.entry) activeEntryType = L.entry;
    if (L.analysis) activeAnalysisType = L.analysis;
    if (!lessonSteps().some(s => s.id === step)) return false;
    const group = stepById(step).group;
    current = step;
    activePath = group === 'Patient Not Found' ? 'A' : group === 'Patient Found' ? 'B' : (path === 'A' || path === 'B' ? path : null);
    renderLesson();
    return true;
  }

  function route(hash) {
    let parts;
    try { parts = hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent); } catch (e) { parts = ['home']; }
    const name = parts[0] || 'home';
    restoring = true;
    try {
      closeLightbox();
      hidePortalSearch(true);
      const ok = name === 'lesson' ? openLesson(parts[1], parts[2], parts[3])
        : own(VIEWS, name) ? openView(VIEWS[name], parts[1])
        : false;
      if (!ok) showHome();
    } finally {
      restoring = false;
    }
    lastHash = currentHash();
    if (location.hash !== lastHash) history.replaceState(null, '', lastHash);
  }

  Object.values(VIEWS).forEach(({ fn }) => {
    const original = window[fn];
    window[fn] = function () { const result = original.apply(this, arguments); record(); return result; };
  });
  const originalRenderLesson = renderLesson;
  renderLesson = function () { const result = originalRenderLesson.apply(this, arguments); record(); return result; };

  const onNavigate = () => { if (location.hash !== lastHash) { route(location.hash); window.scrollTo(0, 0); } };
  window.addEventListener('popstate', onNavigate);
  window.addEventListener('hashchange', onNavigate);

  window.startRouter = () => route(initialHash);
})();
setLang(lang);
startRouter();
</script>
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot preview" onclick="if(event.target===this)closeLightbox()"><div class="lightbox-panel"><button class="lightbox-close" type="button" aria-label="Close screenshot" onclick="closeLightbox()">×</button><img id="lightboxImage" alt=""><div id="lightboxCaption" class="lightbox-caption"></div></div></div>
